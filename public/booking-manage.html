<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - จัดการตู้คอนเทนเนอร์ (Container & Dispatch)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Handsontable (ตารางสไตล์ Excel) -->
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>
    <style>
        .active-booking { border-left: 4px solid #10b981 !important; background-color: #ecfdf5 !important; }
        .handsontable th { font-weight: bold !important; font-size: 13px !important; background-color: #f8fafc !important; color: #475569 !important; }
        .handsontable td { font-size: 13px !important; vertical-align: middle !important; }
        .ht-count-col { background-color: #f1f5f9 !important; font-weight: bold; text-align: center; color: #0f4c81; }
        /* แต่ง Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-emerald-600 text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-boxes-stacked"></i></div>
            <span class="font-bold text-xl text-slate-800 tracking-wide">TERN TMS <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold ml-1">CONTAINER DISPATCH</span></span>
        </div>
        <div class="flex items-center gap-4">
            <a href="/index.html" class="text-slate-500 hover:text-emerald-600 font-medium text-sm flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-lg transition-colors border border-slate-200"><i class="fa-solid fa-arrow-left"></i> กลับหน้าแรก</a>
            <div id="user-fullname" class="text-sm font-bold text-slate-700 hidden sm:block">Loading...</div>
        </div>
    </header>

    <!-- 🔍 STICKY FILTER BAR (แถบกรองติดหนึบด้านบน) -->
    <div class="bg-white border-b border-slate-200 p-3 shrink-0 z-20 shadow-sm flex flex-wrap gap-4 items-end">
        <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">วันที่วิ่งงาน (Run Date)</label>
            <input type="date" id="filter-date" class="px-3 py-1.5 border border-slate-300 rounded focus:border-emerald-500 outline-none text-sm w-40 font-semibold text-slate-700">
        </div>
        <div class="w-64">
            <label class="block text-xs font-bold text-slate-500 mb-1">ลูกค้า (Customer)</label>
            <select id="filter-customer" class="w-full px-3 py-1.5 border border-slate-300 rounded focus:border-emerald-500 outline-none text-sm">
                <option value="">-- ทุกลูกค้า --</option>
            </select>
        </div>
        <div class="flex-1 max-w-sm">
            <label class="block text-xs font-bold text-slate-500 mb-1">ค้นหา (Booking No.)</label>
            <input type="text" id="filter-search" placeholder="พิมพ์เลข Booking..." class="w-full px-3 py-1.5 border border-slate-300 rounded focus:border-emerald-500 outline-none text-sm uppercase">
        </div>
        <button onclick="loadBookings()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-1.5 rounded transition-colors text-sm flex items-center gap-2 h-[34px] shadow-sm">
            <i class="fa-solid fa-search"></i> ค้นหา
        </button>
    </div>

    <!-- MAIN WORKSPACE -->
    <main class="flex-1 flex gap-4 p-4 overflow-hidden relative">
        
        <!-- ซีกซ้าย: รายการ Booking -->
        <div class="w-[320px] bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-full shrink-0 overflow-hidden">
            <div class="bg-slate-50 p-3 border-b border-slate-200 font-bold text-slate-700 text-sm flex justify-between items-center">
                <span><i class="fa-solid fa-list-ul text-emerald-600 mr-2"></i> รายการ Booking</span>
                <span id="booking-count-badge" class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-xs">0 รายการ</span>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-2 bg-slate-50/50" id="booking-list-container">
                <div class="text-center py-10 text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i> โหลดข้อมูล...</div>
            </div>
        </div>

        <!-- ซีกขวา: ตาราง Excel (Handsontable) -->
        <div id="workspace-panel" class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-full hidden overflow-hidden">
            <div class="px-5 py-3 border-b border-slate-200 bg-white flex justify-between items-center shrink-0">
                <div>
                    <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-table-list text-emerald-600"></i> จัดการตู้: <span id="ws-booking-no" class="text-blue-600"></span>
                    </h2>
                    <p class="text-xs text-slate-500 mt-1" id="ws-booking-subtitle"></p>
                </div>
                <div class="flex gap-2">
                    <button onclick="resetTableUI()" class="text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded text-sm font-bold transition-colors border border-slate-300" title="รีเซ็ตความกว้าง/ตำแหน่งคอลัมน์">
                        <i class="fa-solid fa-rotate-left"></i> รีเซ็ตตาราง
                    </button>
                    <button onclick="saveContainerData()" id="btn-save-containers" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded text-sm font-bold transition-colors shadow-sm">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกข้อมูลตู้
                    </button>
                </div>
            </div>

            <!-- กล่องแสดงตาราง Handsontable -->
            <div class="flex-1 relative w-full overflow-hidden bg-slate-50">
                <div id="hot-container" class="absolute inset-0 z-0"></div>
            </div>
        </div>

        <!-- หน้าจอว่างเปล่า -->
        <div id="empty-state" class="flex-1 bg-slate-50 rounded-xl border border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 h-full">
            <i class="fa-solid fa-hand-pointer text-5xl mb-4 text-slate-300"></i>
            <p class="font-bold text-lg">คลิกเลือกรายการ Booking จากเมนูด้านซ้าย</p>
            <p class="text-sm">เพื่อลงข้อมูลเบอร์ตู้ น้ำหนัก และรายละเอียดในรูปแบบตาราง Excel</p>
        </div>
    </main>

    <script>
        // ==========================================
        // ⚙️ ตัวแปรและ State ของตาราง
        // ==========================================
        let hotInstance = null;
        let globalBookingsData = [];
        let currentActiveBookingNo = null;
        let currentUsername = 'Guest';

        const COL_HEADERS = ['Order ID', 'เบอร์ตู้ 1', 'เบอร์ตู้ 2', 'จำนวนตู้/ใบ', 'ขนาดตู้', 'POD', 'SEAL NO', 'TAREMAX', 'GROSS', 'น้ำหนักตู้'];

        window.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('tms_user'));
            if (!user) { window.location.href = '/login.html'; return; }
            currentUsername = user.username;
            document.getElementById('user-fullname').innerText = user.fullName;

            // 🌟 ตั้งค่าเริ่มต้นวันที่วิ่งงาน = วันปัจจุบัน
            const today = new Date().toLocaleDateString('en-CA'); // รูปแบบ YYYY-MM-DD
            document.getElementById('filter-date').value = today;

            await loadCustomers();
            loadBookings();
        });

        // ==========================================
        // 🔍 ส่วนโหลดข้อมูลและตัวกรอง
        // ==========================================
        async function loadCustomers() {
            try {
                const res = await fetch('/api/customers');
                if (res.ok) {
                    const data = await res.json();
                    const sel = document.getElementById('filter-customer');
                    if(data.data) {
                        data.data.forEach(c => { if(c[1]) sel.innerHTML += `<option value="${c[1]}">${c[1]}</option>`; });
                    }
                }
            } catch (err) {}
        }

        async function loadBookings() {
            const listDiv = document.getElementById('booking-list-container');
            listDiv.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังค้นหา...</div>';
            
            // กรองด้วยวันที่วันเดียว (ตั้งต้นคือวันนี้)
            const date = document.getElementById('filter-date').value;
            const cus = document.getElementById('filter-customer').value;
            const q = document.getElementById('filter-search').value;

            try {
                let url = `/api/bookings/search?start_date=${date}&end_date=${date}`;
                if(cus) url += `&customer=${encodeURIComponent(cus)}`;
                if(q) url += `&search=${encodeURIComponent(q)}`;

                const res = await fetch(url);
                const result = await res.json();
                listDiv.innerHTML = '';
                
                if (result.success && result.data.length > 0) {
                    globalBookingsData = result.data;
                    document.getElementById('booking-count-badge').innerText = `${result.data.length} รายการ`;
                    
                    result.data.forEach(bk => {
                        const div = document.createElement('div');
                        div.id = `card-${bk.booking_no}`;
                        div.className = 'p-3 border border-slate-200 bg-white rounded-lg cursor-pointer hover:border-emerald-400 hover:shadow-md transition-all';
                        div.onclick = () => selectBooking(bk.booking_no);
                        div.innerHTML = `
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-bold text-emerald-700">${bk.booking_no}</span>
                                <span class="text-[10px] bg-slate-100 font-bold px-2 py-0.5 rounded text-slate-500">${bk.container_count} ตู้</span>
                            </div>
                            <div class="text-sm font-semibold text-slate-700 truncate">${bk.customer_name || 'ไม่ระบุลูกค้า'}</div>
                            <div class="text-xs text-slate-500 mt-1 truncate"><i class="fa-solid fa-route mr-1 text-slate-300"></i> ${bk.origin || '?'} ➡️ ${bk.destination || '?'}</div>
                        `;
                        listDiv.appendChild(div);
                    });
                } else {
                    document.getElementById('booking-count-badge').innerText = `0 รายการ`;
                    listDiv.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm"><i class="fa-solid fa-inbox text-2xl mb-2 block text-slate-300"></i>ไม่พบงานในวันนี้</div>`;
                }
            } catch (error) { listDiv.innerHTML = `<div class="text-red-500 text-sm text-center py-4">Error: ${error.message}</div>`; }
        }

        // ==========================================
        // 🖱️ คลิกเลือกบิล และสร้างตาราง Handsontable
        // ==========================================
        function selectBooking(bookingNo) {
            currentActiveBookingNo = bookingNo;
            
            document.querySelectorAll('#booking-list-container > div').forEach(el => el.classList.remove('active-booking'));
            document.getElementById(`card-${bookingNo}`).classList.add('active-booking');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('workspace-panel').classList.remove('hidden');
            
            const bk = globalBookingsData.find(b => b.booking_no === bookingNo);
            document.getElementById('ws-booking-no').innerText = bookingNo;
            document.getElementById('ws-booking-subtitle').innerText = `ลูกค้า: ${bk.customer_name} | เส้นทาง: ${bk.origin} -> ${bk.destination}`;

            fetchContainersForGrid(bookingNo);
        }

        async function fetchContainersForGrid(bookingNo) {
            try {
                const res = await fetch(`/api/bookings/${bookingNo}/containers`);
                const result = await res.json();
                
                let tableData = [];
                if (result.success && result.data.length > 0) {
                    result.data.forEach(row => {
                        let raw = [];
                        try { raw = JSON.parse(row.raw_data); } catch(e){}
                        
                        // สมมติโครงสร้าง Array ให้ตรงกับ UI ที่ต้องการ (คุณสามารถปรับเลข Index Raw ให้ตรงฐานข้อมูลจริงได้)
                        // [0] = Order ID, [1] = เบอร์ตู้ 1, [2] = เบอร์ตู้ 2, [3] = จำนวน, [4] = ขนาด, [5] = POD, [6] = SEAL, [7] = TAREMAX, [8] = GROSS, [9] = น้ำหนักตู้
                        tableData.push([
                            row.order_id, 
                            raw[14] || '', // เบอร์ตู้ 1 (สมมติ index 14)
                            raw[15] || '', // เบอร์ตู้ 2
                            raw[16] || '', // จำนวนตู้ (คำนวณ)
                            raw[17] || '', // ขนาดตู้
                            raw[18] || '', // POD
                            raw[19] || '', // SEAL
                            raw[20] || '', // TAREMAX
                            raw[21] || '', // GROSS
                            raw[22] || ''  // น้ำหนัก
                        ]);
                    });
                }
                
                // ถ้าไม่มีข้อมูลเลย ให้สร้างแถวว่างเผื่อไว้ 1 แถว
                if(tableData.length === 0) tableData = [["", "", "", "", "", "", "", "", "", ""]];

                renderHandsontable(tableData);
            } catch(e) { console.error("Error fetching containers", e); }
        }

        // ==========================================
        // 📊 ฟังก์ชันจัดการตาราง Handsontable (Excel-like)
        // ==========================================
        function getTableUIState() {
            return JSON.parse(localStorage.getItem(`tms_grid_${currentUsername}`)) || {};
        }

        function saveTableUIState(state) {
            const existing = getTableUIState();
            localStorage.setItem(`tms_grid_${currentUsername}`, JSON.stringify({ ...existing, ...state }));
        }

        function resetTableUI() {
            localStorage.removeItem(`tms_grid_${currentUsername}`);
            alert('รีเซ็ตการตั้งค่าตารางแล้ว รีโหลดหน้าเว็บเพื่อดูการเปลี่ยนแปลง');
            window.location.reload();
        }

        function renderHandsontable(data) {
            const container = document.getElementById('hot-container');
            if (hotInstance) {
                hotInstance.destroy();
                hotInstance = null;
            }

            const uiState = getTableUIState();

            hotInstance = new Handsontable(container, {
                data: data,
                colHeaders: COL_HEADERS,
                rowHeaders: true,
                width: '100%',
                height: '100%',
                stretchH: 'all', // ขยายเต็มหน้าจอ
                minSpareRows: 1, // มีแถวว่างให้พิมพ์ต่อเรื่อยๆ
                
                // 🌟 การจำค่าคอลัมน์ (เหมือน Excel)
                manualColumnResize: true,
                manualColumnMove: true,
                colWidths: uiState.colWidths || [150, 140, 140, 90, 100, 120, 120, 100, 100, 100],
                manualColumnMove: uiState.colMove || true,
                filters: true,
                dropdownMenu: ['filter_by_condition', 'filter_by_value', 'filter_action_bar'],
                
                // 🌟 ประเภทของเซลล์
                columns: [
                    { readOnly: true, className: 'htCenter htMiddle' }, // Order ID (ไม่ให้แก้)
                    { type: 'text', className: 'uppercase' }, // เบอร์ตู้ 1
                    { type: 'text', className: 'uppercase' }, // เบอร์ตู้ 2
                    { type: 'numeric', readOnly: true, className: 'ht-count-col' }, // จำนวนตู้ (คำนวณออโต้)
                    { type: 'dropdown', source: ["20'", "40'", "45'", "ISO TANK"] }, // ขนาดตู้
                    { type: 'text' }, // POD
                    { type: 'text' }, // SEAL NO
                    { type: 'numeric', numericFormat: { pattern: '0,0.00' } }, // TAREMAX
                    { type: 'numeric', numericFormat: { pattern: '0,0.00' } }, // GROSS
                    { type: 'numeric', numericFormat: { pattern: '0,0.00' } }  // น้ำหนัก
                ],

                licenseKey: 'non-commercial-and-evaluation',

                // 🌟 Event เมื่อพิมพ์ข้อมูล (คำนวณจำนวนตู้อัตโนมัติ)
                afterChange: function(changes, source) {
                    if (source !== 'loadData' && changes) {
                        changes.forEach(([row, prop, oldValue, newValue]) => {
                            // ถ้ามีการพิมพ์ในคอลัมน์ Index 1 (เบอร์ตู้1) หรือ Index 2 (เบอร์ตู้2)
                            if (prop === 1 || prop === 2) {
                                const cont1 = this.getDataAtCell(row, 1);
                                const cont2 = this.getDataAtCell(row, 2);
                                
                                let count = 0;
                                if (cont1 && String(cont1).trim() !== '') count++;
                                if (cont2 && String(cont2).trim() !== '') count++;
                                
                                // สั่งอัปเดตช่อง จำนวนตู้ (Index 3)
                                this.setDataAtCell(row, 3, count === 0 ? '' : count, 'autoCount');
                            }
                        });
                    }
                },

                // 🌟 Event การจำค่า User
                afterColumnResize: function() { 
                    saveTableUIState({ colWidths: this.getPlugin('manualColumnResize').manualColumnWidths }); 
                },
                afterColumnMove: function(movedColumns, finalIndex, dropIndex, movePossible, orderChanged) {
                    if(orderChanged) saveTableUIState({ colMove: this.getPlugin('manualColumnMove').columnsMapper._arrayMap });
                }
            });
        }

        // ==========================================
        // 💾 บันทึกข้อมูลตู้
        // ==========================================
        async function saveContainerData() {
            if(!hotInstance || !currentActiveBookingNo) return;
            
            const btn = document.getElementById('btn-save-containers');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...';
            btn.disabled = true;

            // กรองเอาเฉพาะแถวที่มีการกรอกเบอร์ตู้ 1 หรือมี Order ID
            const rawTableData = hotInstance.getData();
            const validData = rawTableData.filter(row => (row[1] && row[1].trim() !== '') || row[0]);

            try {
                // ยิง API (คุณจะต้องสร้าง Endpoint รองรับการรับค่า Array จากหน้านี้)
                // สมมติยิงไปที่ PUT /api/shipments/bulk-containers
                alert(`(จำลองการบันทึก) บันทึกข้อมูลตู้จำนวน ${validData.length} รายการ สำหรับบิล ${currentActiveBookingNo}`);
                
                // หลังจากบันทึกเสร็จ
                btn.innerHTML = '<i class="fa-solid fa-check"></i> บันทึกสำเร็จ';
                setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 2000);
            } catch (error) {
                alert('เกิดข้อผิดพลาด: ' + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
