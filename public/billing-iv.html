<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. รายการ IV (ใบแจ้งหนี้) - TERN TMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } } }</script>
    <link href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .tab-btn-active { background-color: #8b5cf6; color: white; font-weight: bold; border-color: #7c3aed; }
        .tab-btn-inactive { background-color: #f1f5f9; color: #64748b; font-weight: 600; transition: all 0.2s; }
        .tab-btn-inactive:hover { background-color: #e2e8f0; color: #334155; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-6 shrink-0 shadow-sm z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-purple-600 text-white rounded-lg flex items-center justify-center text-sm shadow-sm"><i class="fa-solid fa-file-invoice-dollar"></i></div>
            <span class="font-bold text-lg text-slate-800">ระบบวางบิล & บัญชี</span>
            <div class="h-5 w-px bg-slate-300 mx-2"></div>
            
            <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs gap-1">
                <a href="/billing.html" class="tab-btn-inactive px-3 py-1.5 rounded-md flex items-center gap-1.5"><i class="fa-solid fa-list-check"></i> 1. หน้ารายการ Booking</a>
                <a href="/billing-detail.html" class="tab-btn-inactive px-3 py-1.5 rounded-md flex items-center gap-1.5"><i class="fa-solid fa-table-list"></i> 2. บันทึกข้อมูลตู้ (Data Entry)</a>
                <a href="/billing-iv.html" class="tab-btn-active px-3 py-1.5 rounded-md flex items-center gap-1.5"><i class="fa-solid fa-receipt"></i> 3. รายการ IV (ใบแจ้งหนี้)</a>
            </div>
            <div class="h-5 w-px bg-slate-300 mx-2"></div>
            <a href="/index.html" class="text-slate-500 hover:text-slate-800 font-semibold text-xs flex items-center gap-1"><i class="fa-solid fa-house"></i> หน้าแรก</a>
        </div>
        <div class="flex items-center gap-4">
            <div id="user-fullname" class="text-xs font-bold text-slate-700">Loading...</div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 p-2"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <!-- Filter Bar -->
    <div class="bg-white border-b border-slate-200 px-6 py-2 shrink-0 shadow-sm z-40 flex flex-wrap items-center gap-2 text-xs justify-between">
        <div class="flex items-center gap-2">
            <div class="flex items-center bg-slate-100 border border-slate-300 rounded-lg overflow-hidden h-8">
                <div class="px-3 py-1 bg-slate-200 border-r border-slate-300 text-slate-600 font-bold flex items-center h-full"><i class="fa-regular fa-calendar-check text-blue-600 mr-1"></i> เดือน:</div>
                <input type="month" id="filter-month" onchange="loadIvData()" class="px-3 py-1 font-bold text-slate-700 bg-transparent outline-none cursor-pointer h-full">
            </div>
            
            <!-- 🌟 เพิ่มช่องค้นหาเลข IV ตรงนี้ -->
            <input type="text" autocomplete="off" id="filter-iv-no" placeholder="📄 ค้นหาเลข IV..." oninput="filterIvGrid()" class="px-3 py-1 border border-slate-300 rounded text-xs outline-none bg-slate-50 h-8 w-32 focus:bg-white focus:border-blue-400 font-bold text-blue-700">
            
            <input type="text" autocomplete="off" id="filter-customer" placeholder="🏢 ค้นหาลูกค้า..." oninput="filterIvGrid()" class="px-3 py-1 border border-slate-300 rounded text-xs outline-none bg-slate-50 h-8 w-36 focus:bg-white focus:border-blue-400">
            <input type="text" autocomplete="off" id="filter-booking" placeholder="📝 ค้นหา Booking..." oninput="filterIvGrid()" class="px-3 py-1 border border-slate-300 rounded text-xs outline-none bg-slate-50 h-8 w-36 focus:bg-white focus:border-blue-400">
            
            <select id="filter-status" onchange="filterIvGrid()" class="px-2 py-1 border border-slate-300 rounded text-xs outline-none bg-slate-50 h-8 focus:bg-white focus:border-blue-400 font-semibold">
                <option value="">-- ทุกสถานะบิล --</option>
                <option value="รอวางบิล">🟡 รอวางบิล</option>
                <option value="วางบิลแล้ว">🔵 วางบิลแล้ว</option>
                <option value="รับชำระแล้ว">🟢 รับชำระแล้ว</option>
                <option value="ยกเลิก">🔴 ยกเลิก</option>
            </select>
        </div>
        <div class="flex gap-2">
            <button onclick="saveIvChanges()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-1.5 rounded shadow text-[11px] flex items-center gap-1.5">
                <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูลตาราง
            </button>
        </div>
    </div>

    <!-- Summary Box -->
    <div class="px-6 py-3 shrink-0 flex gap-4">
        <div class="bg-white px-5 py-2.5 rounded-xl shadow-sm border border-slate-200 flex-1 flex justify-between items-center">
            <div>
                <div class="text-[10px] text-slate-400 font-bold tracking-wide">จำนวนใบแจ้งหนี้รวม</div>
                <div class="text-xl font-bold text-slate-700"><span id="sum-iv-count">0</span> <span class="text-xs font-normal text-slate-500">บิล</span></div>
            </div>
            <div class="w-px h-8 bg-slate-200"></div>
            <div>
                <div class="text-[10px] text-slate-400 font-bold tracking-wide">ยอดหนี้ค้างชำระ (รอวางบิล + วางบิลแล้ว)</div>
                <div class="text-xl font-bold text-blue-600"><span id="sum-pending-amt">0.00</span> <span class="text-xs font-normal text-slate-500">บาท</span></div>
            </div>
            <div class="w-px h-8 bg-slate-200"></div>
            <div>
                <div class="text-[10px] text-slate-400 font-bold tracking-wide">ยอดรับชำระเงินแล้ว (Paid)</div>
                <div class="text-xl font-bold text-emerald-600"><span id="sum-paid-amt">0.00</span> <span class="text-xs font-normal text-slate-500">บาท</span></div>
            </div>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="flex-1 flex flex-col p-6 pt-0">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-2 flex-1 flex flex-col relative">
            <div id="iv-loading-overlay" class="absolute inset-0 bg-white/80 z-50 flex items-center justify-center hidden backdrop-blur-sm rounded-xl">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-purple-600"></i>
            </div>
            <div id="iv-grid-container" class="flex-1 w-full rounded"></div>
        </div>
    </div>

    <script src="/js/modules/billing/iv.js"></script>

    <!-- 1. ใส่สคริปต์ควบคุมสิทธิ์และเมนูตัวกลาง (Auth & Sidebar) -->
    <script src="/js/auth.js"></script>
    
    <!-- 2. ใส่สคริปต์เปลี่ยนรหัสผ่าน (เพิ่มกุญแจมุมขวาบน) -->
    <script src="/js/password.js"></script>
</body>
</html>
