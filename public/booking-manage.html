<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - จัดรถ & ลงเบอร์ตู้</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>

    <!-- Handsontable & Datepicker -->
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pikaday@1.8.2/pikaday.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/pikaday@1.8.2/css/pikaday.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col relative">

    <!-- Header Navigation Bar -->
<header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-6 shrink-0 shadow-sm z-50">
    <div class="flex items-center gap-3">
        <!-- Logo -->
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-900 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow-sm">
                <i class="fa-solid fa-truck-fast"></i>
            </div>
            <span class="font-bold text-lg text-slate-800">TERN TMS</span>
        </div>

        <div class="h-5 w-px bg-slate-300 mx-1"></div>

        <!-- 🌟 ปุ่มหน้าแรก ( Home Button ) -->
        <a href="/index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-lg border border-slate-300 text-xs transition-colors flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-house text-blue-900"></i> หน้าแรก
        </a>

        <div class="h-5 w-px bg-slate-300 mx-1"></div>

        <!-- แท็บเดิม (1. สร้างรับงาน / 2. อัปโหลด Job / 3. รายการบุคกิ้ง) -->
        <div class="flex gap-1 text-xs">
            <button onclick="switchTab('create')" class="px-3 py-1.5 rounded-lg font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center gap-1">
                <i class="fa-solid fa-pen-to-square"></i> 1. สร้างรับงาน
            </button>
            <button onclick="switchTab('upload')" class="px-3 py-1.5 rounded-lg font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center gap-1">
                <i class="fa-solid fa-file-excel"></i> 2. อัปโหลด Job
            </button>
            <button onclick="switchTab('list')" class="px-3 py-1.5 rounded-lg font-bold bg-blue-900 text-white flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-list-check"></i> 3. รายการบุคกิ้ง
            </button>
        </div>
    </div>

    <!-- ส่วนขวา (User Profile & Logout) -->
    <div class="flex items-center gap-4 text-xs">
        <div class="text-right">
            <div id="user-fullname" class="font-bold text-slate-800">GXEM Administrator</div>
            <div id="user-role-badge" class="text-[10px] text-slate-500 font-semibold">ADMIN</div>
        </div>
        <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-2" title="ออกจากระบบ">
            <i class="fa-solid fa-power-off"></i>
        </button>
    </div>
</header>

    <main class="flex-1 p-3 overflow-hidden flex flex-col gap-2 relative">
        <div class="bg-white px-3 py-2 rounded-lg shadow-sm border border-slate-200 flex flex-col gap-2 shrink-0 z-10">
            <!-- แถวบน: ตัวกรอง -->
            <div class="flex flex-wrap justify-between items-center gap-2">
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex items-center gap-1.5 bg-emerald-50 px-2 py-1 rounded border border-emerald-200 h-8">
                        <label class="text-xs font-bold text-emerald-700 flex items-center gap-1"><i class="fa-regular fa-calendar-check"></i> เดือน:</label>
                        <input type="month" id="filter-month" onchange="loadContainerGridData()" class="px-1 py-0 border-none bg-transparent text-xs font-bold text-emerald-700 outline-none cursor-pointer">
                    </div>
                    
                    <input type="text" id="filter-run-date" list="dl-run-date" onchange="handleCrossFilter()" placeholder="📅 วันที่วิ่งงาน..." class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 h-8 w-32 focus:bg-white focus:border-emerald-500">
                    <datalist id="dl-run-date"></datalist>

                    <input type="text" id="filter-customer" list="dl-customer" onchange="handleCrossFilter()" placeholder="🏢 ชื่องาน/ลูกค้า..." class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 h-8 w-44 focus:bg-white focus:border-emerald-500">
                    <datalist id="dl-customer"></datalist>

                    <input type="text" id="filter-booking-no" list="dl-booking-no" onchange="handleCrossFilter()" placeholder="📝 เลข Booking..." class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 h-8 w-32 focus:bg-white focus:border-emerald-500">
                    <datalist id="dl-booking-no"></datalist>

                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-2 top-2.5 text-slate-400 text-xs"></i>
                        <input type="text" id="global-search" onkeyup="applyFilters()" placeholder="ค้นหาเบอร์ตู้..." class="pl-7 pr-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-white h-8 w-48 focus:border-emerald-500 shadow-sm">
                    </div>
                    <button onclick="clearAllFilters()" class="text-slate-400 hover:text-red-500 px-2 h-8 transition-colors"><i class="fa-solid fa-eraser text-sm"></i></button>
                </div>

                <div class="flex items-center gap-2">
                    <button id="btn-toggle-drops" onclick="toggleDropYards()" class="bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold py-1 px-3 rounded text-xs flex items-center gap-1 border border-purple-200 h-8 shadow-sm transition-colors">
                        <i class="fa-solid fa-eye-slash"></i> แสดงลานฝากตู้
                    </button>
                    
                    <button onclick="saveGridSettings()" class="bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold py-1 px-3 rounded text-xs flex items-center gap-1 border border-amber-300 h-8 shadow-sm">
                        <i class="fa-solid fa-table-columns"></i> จำมุมมอง
                    </button>
                    <button onclick="deleteContainerRows()" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-1 px-3 rounded text-xs flex items-center gap-1 border border-red-200 h-8 shadow-sm">
                        <i class="fa-solid fa-trash-can"></i> ลบตู้
                    </button>
                    <button onclick="addNewContainerRow()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-1 px-3 rounded text-xs flex items-center gap-1 border border-blue-200 h-8 shadow-sm">
                        <i class="fa-solid fa-plus"></i> เพิ่มตู้เข้า Booking
                    </button>
                    <button onclick="saveGridChanges()" id="btn-save-grid" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1 px-4 rounded flex items-center gap-1 text-xs h-8 shadow-sm">
                        <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล
                    </button>
                </div>
            </div>
            
            <div class="flex items-center gap-2 text-xs border-t border-slate-100 pt-2">
                <span class="font-bold text-slate-500"><i class="fa-solid fa-bolt text-amber-500"></i> ตัวกรองด่วน:</span>
                <button id="qf-pending" onclick="setQuickFilter('pending')" class="px-3 py-1 rounded-full border border-slate-300 bg-white hover:bg-blue-50 hover:text-blue-600 font-medium text-slate-600 transition-colors shadow-sm">รอลงเบอร์ตู้</button>
                <button id="qf-filled" onclick="setQuickFilter('filled')" class="px-3 py-1 rounded-full border border-slate-300 bg-white hover:bg-blue-50 hover:text-blue-600 font-medium text-slate-600 transition-colors shadow-sm">ลงเบอร์ตู้แล้ว</button>
                
                <span id="save-status-badge" class="ml-auto font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full border border-slate-200 flex items-center gap-1"><i class="fa-solid fa-check text-emerald-500"></i> อัปเดตล่าสุดแล้ว</span>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-slate-200 flex-1 relative overflow-hidden">
            <div id="loading-overlay" class="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-600 mb-3"></i>
                <p class="font-bold text-slate-600">กำลังโหลดข้อมูลตู้...</p>
            </div>
            <div id="container-grid-container" class="absolute inset-0 z-0"></div>
        </div>
    </main>

    <!-- 🌟 SMART DISPATCH MODAL (หน้าต่างจัดรถแบบใหม่) 🌟 -->
    <div id="dispatch-modal" class="hidden absolute inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full max-w-5xl rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.3s_ease-out]">
            
            <!-- Header -->
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-emerald-600 text-white shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="bg-white/20 p-2.5 rounded-xl shadow-inner"><i class="fa-solid fa-truck-fast text-2xl"></i></div>
                    <div>
                        <h3 class="font-bold text-xl leading-tight tracking-wide">จัดการคิวรถและคนขับ (Dispatch)</h3>
                        <p class="text-sm text-emerald-100 mt-0.5">กำลังจัดการข้อมูลตู้ของแถวที่: <span id="modal-row-display" class="font-bold text-white bg-emerald-800 px-2 py-0.5 rounded text-xs ml-1"></span></p>
                    </div>
                </div>
                <button onclick="document.getElementById('dispatch-modal').classList.add('hidden')" class="text-white/80 hover:text-white hover:bg-white/10 p-2 rounded-lg transition-colors"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>

            <!-- Body : Grid 3 ขา -->
            <div class="p-6 bg-slate-50 overflow-y-auto max-h-[75vh]">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    
                    <!-- 🚚 LEG 1 -->
                    <div class="bg-white rounded-xl border border-blue-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow">
                        <div class="bg-gradient-to-r from-blue-50 to-white border-b border-blue-100 px-4 py-3 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="bg-blue-100 text-blue-600 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-1"></i></div>
                                <span class="font-bold text-blue-800">PICK UP (รับตู้)</span>
                            </div>
                            <input type="checkbox" id="modal-leg1-check" class="w-4 h-4 accent-blue-600 rounded cursor-pointer" title="วิ่งงานเสร็จแล้ว">
                        </div>
                        <div class="p-5 flex flex-col gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-500 mb-1.5 flex items-center gap-1"><i class="fa-solid fa-truck"></i> ทะเบียนรถ</label>
                                <select id="modal-leg1-plate" onchange="handleModalTruckChange(1)" class="w-full text-sm font-medium text-slate-700 border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 mb-1.5 flex items-center gap-1"><i class="fa-solid fa-id-badge"></i> พนักงานขับรถ</label>
                                <select id="modal-leg1-driver" class="w-full text-sm font-medium text-slate-700 border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 mb-1.5 flex items-center gap-1"><i class="fa-regular fa-clock"></i> วัน-เวลานัดหมาย</label>
                                <input type="datetime-local" id="modal-leg1-time" class="w-full text-sm font-medium text-slate-700 border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                        </div>
                    </div>

                    <!-- 🚛 LEG 2 -->
                    <div class="bg-white rounded-xl border border-orange-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow">
                        <div class="bg-gradient-to-r from-orange-50 to-white border-b border-orange-100 px-4 py-3 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="bg-orange-100 text-orange-600 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-2"></i></div>
                                <span class="font-bold text-orange-800">DELIVERY (เข้าบรรจุ)</span>
                            </div>
                            <input type="checkbox" id="modal-leg2-check" class="w-4 h-4 accent-orange-600 rounded cursor-pointer" title="วิ่งงานเสร็จแล้ว">
                        </div>
                        <div class="p-5 flex flex-col gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-500 mb-1.5 flex items-center gap-1"><i class="fa-solid fa-truck"></i> ทะเบียนรถ</label>
                                <select id="modal-leg2-plate" onchange="handleModalTruckChange(2)" class="w-full text-sm font-medium text-slate-700 border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-500 outline-none"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 mb-1.5 flex items-center gap-1"><i class="fa-solid fa-id-badge"></i> พนักงานขับรถ</label>
                                <select id="modal-leg2-driver" class="w-full text-sm font-medium text-slate-700 border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-500 outline-none"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 mb-1.5 flex items-center gap-1"><i class="fa-regular fa-clock"></i> วัน-เวลานัดหมาย</label>
                                <input type="datetime-local" id="modal-leg2-time" class="w-full text-sm font-medium text-slate-700 border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-orange-500 outline-none">
                            </div>
                        </div>
                    </div>

                    <!-- ⚓ LEG 3 -->
                    <div class="bg-white rounded-xl border border-purple-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow">
                        <div class="bg-gradient-to-r from-purple-50 to-white border-b border-purple-100 px-4 py-3 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="bg-purple-100 text-purple-600 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-3"></i></div>
                                <span class="font-bold text-purple-800">RETURN (คืนตู้)</span>
                            </div>
                            <input type="checkbox" id="modal-leg3-check" class="w-4 h-4 accent-purple-600 rounded cursor-pointer" title="วิ่งงานเสร็จแล้ว">
                        </div>
                        <div class="p-5 flex flex-col gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-500 mb-1.5 flex items-center gap-1"><i class="fa-solid fa-truck"></i> ทะเบียนรถ</label>
                                <select id="modal-leg3-plate" onchange="handleModalTruckChange(3)" class="w-full text-sm font-medium text-slate-700 border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 mb-1.5 flex items-center gap-1"><i class="fa-solid fa-id-badge"></i> พนักงานขับรถ</label>
                                <select id="modal-leg3-driver" class="w-full text-sm font-medium text-slate-700 border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 mb-1.5 flex items-center gap-1"><i class="fa-regular fa-clock"></i> วัน-เวลานัดหมาย</label>
                                <input type="datetime-local" id="modal-leg3-time" class="w-full text-sm font-medium text-slate-700 border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-purple-500 outline-none">
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Footer -->
            <div class="p-5 border-t border-slate-200 bg-white flex justify-end gap-3 rounded-b-2xl">
                <button onclick="document.getElementById('dispatch-modal').classList.add('hidden')" class="px-5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-800 transition-colors">ยกเลิก</button>
                <button onclick="saveDispatchModal()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold shadow-md shadow-emerald-200 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> ยืนยันการจัดรถ
                </button>
            </div>
        </div>
    </div>

    <script src="js/modules/booking/manage.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('tms_user');
            if (!savedUser) { window.location.href = '/login.html'; return; }
            const user = JSON.parse(savedUser);
            document.getElementById('user-fullname').innerText = user.fullName || user.username || 'ผู้ดูแลระบบ';
        });
        function logout() { localStorage.removeItem('tms_user'); window.location.href = '/login.html'; }
    </script>
</body>
</html>
