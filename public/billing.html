<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการ Booking (วางบิล) - TERN TMS</title>
    
    <!-- ฟอนต์และไอคอน -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } } }</script>
    
    <!-- Handsontable (สำหรับตาราง) -->
    <link href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        /* สไตล์ปุ่มแท็บ */
        .tab-btn-active { background-color: #8b5cf6; color: white; font-weight: bold; border-color: #7c3aed; }
        .tab-btn-inactive { background-color: #f1f5f9; color: #64748b; font-weight: 600; transition: all 0.2s; }
        .tab-btn-inactive:hover { background-color: #e2e8f0; color: #334155; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-6 shrink-0 shadow-sm z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-purple-600 text-white rounded-lg flex items-center justify-center text-sm shadow-sm">
                <i class="fa-solid fa-file-invoice-dollar"></i>
            </div>
            <span class="font-bold text-lg text-slate-800">ระบบวางบิล & บัญชี</span>
            
            <div class="h-5 w-px bg-slate-300 mx-2"></div>
            
            <!-- เมนูแท็บ 3 หน้า -->
            <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs gap-1">
                <a href="/billing.html" class="tab-btn-active px-3 py-1.5 rounded-md flex items-center gap-1.5">
                    <i class="fa-solid fa-list-check"></i> 1. หน้ารายการ Booking
                </a>
                <a href="/billing-detail.html" class="tab-btn-inactive px-3 py-1.5 rounded-md flex items-center gap-1.5">
                    <i class="fa-solid fa-file-lines"></i> 2. รายละเอียดตู้/เปิดบิล
                </a>
                <a href="/billing-iv.html" class="tab-btn-inactive px-3 py-1.5 rounded-md flex items-center gap-1.5">
                    <i class="fa-solid fa-receipt"></i> 3. รายการ IV (ใบแจ้งหนี้)
                </a>
            </div>

            <div class="h-5 w-px bg-slate-300 mx-2"></div>
            <a href="/index.html" class="text-slate-500 hover:text-slate-800 font-semibold text-xs flex items-center gap-1"><i class="fa-solid fa-house"></i> หน้าแรก</a>
        </div>
        
        <!-- ข้อมูล User -->
        <div class="flex items-center gap-4">
            <div class="text-right">
                <div id="user-fullname" class="text-xs font-bold text-slate-700">Loading...</div>
                <div id="user-role-badge" class="inline-block px-1.5 py-0.5 text-[9px] font-bold rounded bg-slate-100 text-slate-500">ROLE</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 p-2"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <!-- Toolbar (ตัวกรองและปุ่มบันทึก) -->
    <div class="bg-white border-b border-slate-200 px-6 py-2 shrink-0 shadow-sm z-40 flex items-center gap-2 text-xs">
        <div class="flex items-center bg-slate-100 border border-slate-300 rounded-lg overflow-hidden">
            <div class="px-3 py-1.5 bg-slate-200 border-r border-slate-300 text-slate-600 font-bold"><i class="fa-regular fa-calendar-check text-purple-600"></i> เดือน:</div>
            <input type="month" id="filter-month" onchange="loadBillingMasterData()" class="px-3 py-1.5 font-bold text-slate-700 bg-transparent outline-none cursor-pointer">
        </div>
        
        <input type="text" id="global-search" placeholder="🔍 ค้นหา Booking, ชื่อลูกค้า, IV..." class="border border-slate-300 rounded-lg px-3 py-1.5 w-64 outline-none focus:border-purple-400" onkeyup="handleMasterFilter()">
        
        <div class="flex-1"></div>
        <button onclick="saveMasterBillingChanges()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-4 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล IV/AR
        </button>
    </div>

    <!-- พื้นที่ตาราง -->
    <div class="flex-1 overflow-hidden relative p-4">
        <!-- ตัวโหลด -->
        <div id="master-loading-overlay" class="absolute inset-0 bg-white/80 z-50 flex flex-col items-center justify-center hidden">
            <div class="w-10 h-10 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin mb-2"></div>
            <div class="font-bold text-purple-700 text-xs">กำลังโหลดข้อมูล...</div>
        </div>
        
        <!-- คอนเทนเนอร์แสดงตาราง Handsontable -->
        <div id="master-grid-container" class="w-full h-full bg-white rounded-xl shadow-sm border border-slate-200"></div>
    </div>

    <!-- โหลดสคริปต์ -->
    <script src="/js/modules/billing/master.js"></script>
    <script>
        function logout() { localStorage.removeItem('tms_user'); window.location.href = '/login.html'; }
    </script>
</body>
</html>
