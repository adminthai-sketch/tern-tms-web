<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวางบิล - TERN TMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } } }</script>
    <link href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
</head>
<body class="flex flex-col h-screen bg-slate-100 font-sans overflow-hidden">

    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-6 shrink-0 shadow-sm z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-purple-600 text-white rounded-lg flex items-center justify-center text-sm shadow-sm">
                <i class="fa-solid fa-file-invoice-dollar"></i>
            </div>
            <span class="font-bold text-lg text-slate-800">ระบบวางบิล (Booking Master)</span>
            <div class="h-5 w-px bg-slate-300 mx-2"></div>
            <a href="/index.html" class="text-slate-500 hover:text-slate-800 font-semibold text-xs flex items-center gap-1"><i class="fa-solid fa-house"></i> หน้าแรก</a>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="user-fullname" class="text-xs font-bold text-slate-700">Admin</div>
        </div>
    </header>

    <div class="bg-white border-b border-slate-200 px-6 py-2 shrink-0 shadow-sm z-40 flex items-center gap-3 text-xs">
        <div class="flex items-center bg-slate-100 border border-slate-300 rounded-lg overflow-hidden">
            <div class="px-3 py-1.5 bg-slate-200 border-r border-slate-300 text-slate-600 font-bold">
                <i class="fa-regular fa-calendar-check text-purple-600"></i> เดือน:
            </div>
            <input type="month" id="filter-month" onchange="loadBillingMasterData()" class="px-3 py-1.5 font-bold text-slate-700 bg-transparent outline-none cursor-pointer">
        </div>
        
        <button onclick="loadBillingMasterData()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-4 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-rotate"></i> รีเฟรชข้อมูล
        </button>
    </div>

    <div class="flex-1 overflow-hidden relative p-4">
        <div id="master-loading-overlay" class="absolute inset-0 bg-white/80 z-50 flex flex-col items-center justify-center hidden">
            <div class="w-10 h-10 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin mb-2"></div>
            <div class="font-bold text-purple-700 text-xs">กำลังโหลดข้อมูล...</div>
        </div>
        <div id="master-grid-container" class="w-full h-full bg-white rounded-xl shadow-sm border border-slate-200"></div>
    </div>

    <script src="/js/modules/billing/master.js"></script>
</body>
</html>
