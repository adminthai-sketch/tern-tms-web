<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - รายการบุคกิ้ง (Booking Hub)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>

    <!-- Handsontable & Datepicker -->
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pikaday@1.8.2/pikaday.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/pikaday@1.8.2/css/pikaday.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>

    <style>
        .handsontable th { font-weight: 600 !important; font-size: 11px !important; background: #f1f5f9; color: #334155; border-color: #cbd5e1 !important; }
        .handsontable td { font-size: 12px !important; vertical-align: middle; }
        .ht-edited-row { background-color: #fef9c3 !important; }
        .btn-grid { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; margin-right: 2px; display: inline-flex; align-items: center; gap: 3px; }
        .btn-manage { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
        .btn-manage:hover { background: #a7f3d0; }
        .btn-dispatch { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
        .btn-dispatch:hover { background: #bfdbfe; }
        .cell-time-hover:hover { background-color: #f0f9ff; }
    </style>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col relative">

    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-4 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-4">
            <span class="font-bold text-lg text-primary tracking-wide hidden sm:flex items-center gap-2">
                <i class="fa-solid fa-truck-fast"></i> TERN TMS
            </span>
            <div class="flex gap-1 ml-0 sm:ml-2 sm:border-l sm:border-slate-200 sm:pl-3">
                <a href="/booking.html" class="text-slate-500 hover:text-primary hover:bg-blue-50 px-3 py-1.5 rounded-lg font-bold text-xs transition-colors">
                    <i class="fa-solid fa-pen-to-square mr-1"></i> 1. สร้างรับงาน
                </a>
                <a href="/booking-bulk.html" class="text-slate-500 hover:bg-slate-50 px-3 py-1.5 rounded-lg font-bold text-xs transition-colors">
                    <i class="fa-solid fa-file-excel mr-1"></i> 2. อัปโหลด Job
                </a>
                <a href="/booking-list.html" class="bg-primary text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm">
                    <i class="fa-solid fa-table-list mr-1"></i> 3. รายการบุคกิ้ง
                </a>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="user-fullname" class="text-xs font-bold text-slate-700 hidden md:block">กำลังโหลด...</div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-1"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <main class="flex-1 p-3 overflow-hidden flex flex-col gap-2 relative">
        <div class="bg-white px-3 py-2 rounded-lg shadow-sm border border-slate-200 flex flex-col gap-2 shrink-0 z-10">
            <!-- แถวบน: ตัวกรองหลักแบบ Cross-Filtering -->
            <div class="flex flex-wrap justify-between items-center gap-2">
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex items-center gap-1.5 bg-blue-50 px-2 py-1 rounded border border-blue-200 h-8">
                        <label class="text-xs font-bold text-primary flex items-center gap-1"><i class="fa-regular fa-calendar-check"></i> เดือน:</label>
                        <input type="month" id="filter-month" onchange="loadBookingGridData()" class="px-1 py-0 border-none bg-transparent text-xs font-bold text-primary outline-none cursor-pointer">
                    </div>
                    <div class="w-px h-5 bg-slate-200 hidden md:block mx-1"></div>
                    
                    <input type="text" id="filter-run-date" list="dl-run-date" onchange="handleCrossFilter()" placeholder="📅 วันที่วิ่งงาน..." class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 h-8 w-32 focus:bg-white focus:border-primary">
                    <datalist id="dl-run-date"></datalist>

                    <input type="text" id="filter-customer" list="dl-customer" onchange="handleCrossFilter()" placeholder="🏢 ชื่องาน/ลูกค้า..." class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 h-8 w-44 focus:bg-white focus:border-primary">
                    <datalist id="dl-customer"></datalist>

                    <input type="text" id="filter-booking-no" list="dl-booking-no" onchange="handleCrossFilter()" placeholder="📝 เลข Booking/BL..." class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 h-8 w-40 focus:bg-white focus:border-primary">
                    <datalist id="dl-booking-no"></datalist>

                    <div class="w-px h-5 bg-slate-200 hidden md:block mx-1"></div>
                    
                    <!-- Global Fuzzy Search -->
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-2 top-2.5 text-slate-400 text-xs"></i>
                        <input type="text" id="global-search" onkeyup="applyFilters()" placeholder="ค้นหาครอบจักรวาล..." class="pl-7 pr-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-white h-8 w-48 focus:border-primary shadow-sm">
                    </div>
                    
                    <button onclick="clearAllFilters()" class="text-slate-400 hover:text-red-500 px-2 h-8 transition-colors" title="ล้างค่าตัวกรองทั้งหมด"><i class="fa-solid fa-eraser text-sm"></i></button>
                </div>

                <div class="flex items-center gap-2">
                    <a href="/booking.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-3 rounded shadow-sm text-xs transition-all flex items-center gap-1.5 border border-transparent">
    <i class="fa-solid fa-plus"></i> เพิ่ม Booking
</a>
                    <button onclick="saveGridSettings()" class="bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold py-1 px-3 rounded text-xs flex items-center gap-1 border border-amber-300 h-8 shadow-sm">
                        <i class="fa-solid fa-table-columns"></i> จำมุมมองตาราง
                    </button>
                    <button onclick="deleteSelectedRows()" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-1 px-3 rounded text-xs flex items-center gap-1 border border-red-200 h-8 shadow-sm">
                        <i class="fa-solid fa-trash-can"></i> ลบ
                    </button>
                    <button onclick="saveGridChanges()" id="btn-save-grid" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1 px-4 rounded flex items-center gap-1 text-xs h-8 shadow-sm">
                        <i class="fa-solid fa-floppy-disk"></i> บันทึกการแก้ไข
                    </button>
                </div>
            </div>
            
            <!-- แถวล่าง: Quick Filters -->
            <div class="flex items-center gap-2 text-xs border-t border-slate-100 pt-2">
                <span class="font-bold text-slate-500"><i class="fa-solid fa-bolt text-amber-500"></i> ตัวกรองด่วน:</span>
                <button id="qf-today" onclick="setQuickFilter('today')" class="px-3 py-1 rounded-full border border-slate-300 bg-white hover:bg-blue-50 hover:text-blue-600 font-medium text-slate-600 transition-colors shadow-sm">งานวันนี้</button>
                <button id="qf-tomorrow" onclick="setQuickFilter('tomorrow')" class="px-3 py-1 rounded-full border border-slate-300 bg-white hover:bg-blue-50 hover:text-blue-600 font-medium text-slate-600 transition-colors shadow-sm">งานพรุ่งนี้</button>
                
                <span id="save-status-badge" class="ml-auto font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full border border-slate-200 flex items-center gap-1"><i class="fa-solid fa-check text-emerald-500"></i> บันทึกแล้ว</span>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-slate-200 flex-1 relative overflow-hidden">
            <div id="loading-overlay" class="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-3"></i>
                <p class="font-bold text-slate-600">กำลังโหลดข้อมูล...</p>
            </div>
            <div id="booking-grid-container" class="absolute inset-0 z-0"></div>
        </div>
        
        <!-- แถบสรุปยอดด้านล่างสุด (Summary Footer) -->
        <div class="bg-slate-800 text-white px-4 py-2 rounded-lg shadow-sm flex items-center justify-between shrink-0 text-xs font-bold">
            <div><i class="fa-solid fa-chart-pie mr-1 text-emerald-400"></i> สรุปข้อมูลที่กำลังแสดงผลบนตาราง:</div>
            <div class="flex gap-6">
                <div><span class="text-slate-400 font-medium">จำนวนบิล:</span> <span id="sum-count" class="text-emerald-400 text-sm">0</span> <span class="text-slate-400 font-normal">รายการ</span></div>
                <div><span class="text-slate-400 font-medium">รวมจำนวนตู้:</span> <span id="sum-container" class="text-amber-400 text-sm">0</span> <span class="text-slate-400 font-normal">ตู้</span></div>
                <div><span class="text-slate-400 font-medium">รวมค่าขนส่ง:</span> <span id="sum-trans" class="text-blue-300 text-sm">0</span> <span class="text-slate-400 font-normal">บาท</span></div>
                <div><span class="text-slate-400 font-medium">รวมค่าเที่ยว:</span> <span id="sum-trip" class="text-green-300 text-sm">0</span> <span class="text-slate-400 font-normal">บาท</span></div>
            </div>
        </div>
    </main>

    <!-- 🪟 Pop-up Modal สำหรับแก้เวลาด่วนในตาราง -->
    <div id="datetime-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform duration-200" id="datetime-modal-content">
            <div class="bg-blue-50 px-5 py-3 border-b border-blue-100 flex justify-between items-center">
                <h3 class="font-bold text-primary flex items-center gap-2"><i class="fa-solid fa-clock"></i> <span id="modal-title">ตั้งค่าเวลา</span></h3>
                <button onclick="closeDateTimeModal()" class="text-slate-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 space-y-4" id="modal-body"></div>
            <div class="bg-slate-50 px-5 py-3 border-t border-slate-200 flex justify-end gap-2">
                <button onclick="closeDateTimeModal()" class="px-4 py-2 rounded-lg text-slate-600 bg-white border border-slate-300 text-sm font-bold hover:bg-slate-100">ยกเลิก</button>
                <button onclick="saveDateTimeModal()" class="px-4 py-2 rounded-lg text-white bg-emerald-600 text-sm font-bold hover:bg-emerald-700 shadow-sm">บันทึกเวลา</button>
            </div>
        </div>
    </div>

    <script src="js/modules/booking/list.js"></script>
    <script>function logout() { localStorage.removeItem('tms_user'); window.location.href = '/login.html'; }</script>
</body>
</html>
