<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - นำเข้าหลายบุคกิ้ง (Bulk)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>

    <!-- Handsontable & SheetJS -->
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        .handsontable th { font-weight: bold !important; font-size: 12px !important; background: #f8fafc; }
        .handsontable td { font-size: 13px !important; vertical-align: middle; }
        .ht-status-col { font-weight: bold; text-align: center; background-color: #f1f5f9 !important; }
    </style>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col relative">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-truck-fast"></i></div>
            <span class="font-bold text-xl text-primary tracking-wide">TERN TMS <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold ml-1">BULK ENTRY</span></span>
        </div>
        <div class="flex items-center gap-4">
            <a href="/booking-manage.html" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold text-sm flex items-center gap-2 px-4 py-2 rounded-lg border border-emerald-200">
                <i class="fa-solid fa-desktop"></i> ไปหน้าจัดการตู้
            </a>
            <a href="/index.html" class="text-slate-500 hover:text-primary font-medium text-sm flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
                <i class="fa-solid fa-arrow-left"></i> กลับหน้าแรก
            </a>
            <div class="text-right hidden sm:block">
                <div id="user-fullname" class="text-sm font-bold text-slate-700">กำลังโหลด...</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-2"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden justify-center relative">
        <main class="w-full max-w-7xl p-6 overflow-y-auto flex flex-col relative bg-bglight gap-4">
            
            <!-- 🌟 เมนูเลือกหน้าต่างการทำงาน -->
            <div class="flex gap-3 shrink-0">
                <a href="/booking.html" class="bg-white text-slate-500 hover:bg-slate-50 px-6 py-2.5 rounded-lg font-bold text-sm border border-slate-300 flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-file-lines"></i> 1. สร้างรายการแบบเดี่ยว (1 Job)
                </a>
                <a href="/booking-bulk.html" class="bg-primary text-white px-6 py-2.5 rounded-lg font-bold text-sm border border-primary shadow-md flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-file-excel"></i> 2. อัปโหลดหลาย Job พร้อมกัน (Bulk Excel)
                </a>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col h-[700px] relative">
                
                <div id="loading-overlay" class="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center hidden">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-3"></i>
                    <p class="font-bold text-slate-600">กำลังโหลดการตั้งค่าตาราง...</p>
                </div>

                <div class="flex flex-wrap justify-between items-center border-b border-slate-100 pb-4 mb-4 gap-4 shrink-0">
                    <div>
                        <h2 class="text-lg font-bold text-emerald-700 flex items-center gap-2">
                            <i class="fa-solid fa-file-excel"></i> นำเข้าข้อมูลแบบหลาย Job
                        </h2>
                        <div class="flex items-center gap-3 mt-2">
                            <label class="text-sm font-bold text-slate-700">📌 เลือกลักษณะงาน:</label>
                            <select id="bulk-mode" onchange="loadUserGridSettingsAndInit()" class="px-3 py-1.5 border border-emerald-300 rounded-lg text-sm font-bold text-emerald-800 outline-none bg-emerald-50 shadow-sm cursor-pointer">
                                <option value="EXPORT">🚢 EXPORT</option>
                                <option value="IMPORT">🛬 IMPORT</option>
                                <option value="TRANSFER">🚚 TRANSFER</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-2 items-center">
                        <button onclick="saveGridSettings()" class="bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold py-2 px-3 rounded-lg text-xs flex items-center gap-2 border border-amber-300 transition-colors shadow-sm" title="บันทึกความกว้างและลำดับคอลัมน์ลง User DB">
                            <i class="fa-solid fa-table-columns"></i> จำมุมมองตาราง (Save View)
                        </button>
                        <button onclick="downloadExcelTemplate()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-3 rounded-lg text-xs flex items-center gap-2 border border-slate-300 shadow-sm">
                            <i class="fa-solid fa-download text-emerald-600"></i> แม่แบบ Excel
                        </button>
                        <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-lg text-xs flex items-center gap-2 cursor-pointer shadow-sm">
                            <i class="fa-solid fa-file-arrow-up"></i> อัปโหลด Excel
                            <input type="file" accept=".xlsx, .xls, .csv" onchange="uploadExcelFile(event)" class="hidden">
                        </label>
                        <button onclick="processBulkSave()" id="btn-save-bulk" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-5 rounded-lg shadow-md flex items-center gap-2 text-sm transition-transform hover:-translate-y-0.5">
                            <i class="fa-solid fa-cloud-arrow-up"></i> บันทึกข้อมูลทุก Job
                        </button>
                    </div>
                </div>

                <!-- Handsontable -->
                <div class="flex-1 relative w-full overflow-hidden bg-slate-50 border border-slate-200 rounded-lg">
                    <div id="hot-bulk-container" class="absolute inset-0 z-0"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- 🌟 Popup Modal สำหรับเลือกวันและเวลาในตาราง Bulk 🌟 -->
    <div id="bulk-datetime-modal" class="hidden fixed inset-0 bg-slate-900/50 z-50 items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-xl w-[320px] p-6 transform scale-95 transition-transform" id="bulk-datetime-modal-content">
            <h3 id="bulk-modal-title" class="text-lg font-bold text-primary mb-4 border-b pb-2">เลือกวันและเวลา</h3>
            <div class="space-y-4 mb-5">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">📅 วันที่ (Date)</label>
                    <input type="date" id="bulk_modal_date" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary shadow-sm bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">⏱️ เวลา (Time)</label>
                    <input type="time" id="bulk_modal_time" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary shadow-sm bg-slate-50">
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeBulkDateTimeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-lg text-sm transition-colors">ยกเลิก</button>
                <button onclick="saveBulkDateTimeModal()" class="px-4 py-2 bg-primary hover:bg-blue-900 text-white font-bold rounded-lg text-sm transition-colors shadow-sm"><i class="fa-solid fa-check"></i> ยืนยันเวลา</button>
            </div>
        </div>
    </div>

    <script>
        let hotBulkInstance = null;
        let currentUserSettings = {};
        let rateDataMap = {};
        let currentModalRow = -1;
        let currentModalProp = -1;

        window.addEventListener('DOMContentLoaded', async () => {
            const savedUser = localStorage.getItem('tms_user');
            if (!savedUser) { window.location.href = '/login.html'; return; }
            const user = JSON.parse(savedUser);
            document.getElementById('user-fullname').innerText = user.fullName;
            
            try {
                const res = await fetch('/api/rates');
                const d = await res.json();
                if (d.success && d.data) {
                    d.data.forEach(r => {
                        rateDataMap[r[0]] = {
                            customer: r[1], origin: r[2], dest: r[3], jobType: r[6],
                            trp6: r[7], trp10: r[8], trp12: r[9], trpCash: r[10],
                            trn6: r[11], trn10: r[12], trn12: r[13], trnCash: r[14]
                        };
                    });
                }
            } catch (err) {}

            loadUserGridSettingsAndInit();
        });

        function logout() { localStorage.removeItem('tms_user'); window.location.href = '/login.html'; }

        async function loadUserGridSettingsAndInit() {
            const loader = document.getElementById('loading-overlay');
            if (loader) loader.classList.remove('hidden');
            
            const mode = document.getElementById('bulk-mode').value;
            const gridName = `bulk_booking_${mode.toLowerCase()}`; 
            const user = JSON.parse(localStorage.getItem('tms_user') || '{}');

            try {
                const res = await fetch(`/api/users/grid-settings?userId=${user.id}`);
                if (res.ok) {
                    const data = await res.json();
                    currentUserSettings = data.settings?.[gridName] || {};
                }
            } catch (err) {} 
            finally {
                initBulkTable(null, currentUserSettings);
                if (loader) loader.classList.add('hidden');
            }
        }

        async function saveGridSettings() {
            if (!hotBulkInstance) return;
            const mode = document.getElementById('bulk-mode').value;
            const gridName = `bulk_booking_${mode.toLowerCase()}`;
            const user = JSON.parse(localStorage.getItem('tms_user') || '{}');

            const colCount = hotBulkInstance.countCols();
            const widths = [];
            for (let i = 0; i < colCount; i++) { widths.push(hotBulkInstance.getColWidth(i)); }

            const movePlugin = hotBulkInstance.getPlugin('manualColumnMove');
            let positions = [];
            if (movePlugin && typeof movePlugin.columnsMapper !== 'undefined') {
                positions = movePlugin.columnsMapper.getIndexesSequence();
            }

            try {
                const res = await fetch('/api/users/grid-settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id, gridName: gridName, settings: { columnWidths: widths, columnPositions: positions } })
                });
                const result = await res.json();
                if (result.success) alert(`✅ บันทึกการตั้งค่าตารางโหมด ${mode} สำหรับคุณเรียบร้อยแล้ว!`);
            } catch (err) {
                alert("❌ บันทึกล้มเหลว");
            }
        }

        function openBulkDateTimeModal(row, prop, title) {
            currentModalRow = row; 
            currentModalProp = prop;
            
            document.getElementById('bulk-modal-title').innerText = title;
            const currentVal = hotBulkInstance.getDataAtCell(row, prop);
            
            const dateInput = document.getElementById('bulk_modal_date');
            const timeInput = document.getElementById('bulk_modal_time');
            
            if (currentVal && currentVal.includes(' ')) {
                const parts = currentVal.split(' ');
                dateInput.value = parts[0] || '';
                timeInput.value = parts[1] || '';
            } else {
                dateInput.value = ''; timeInput.value = '';
            }

            const modal = document.getElementById('bulk-datetime-modal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
        }

        function closeBulkDateTimeModal() {
            const modal = document.getElementById('bulk-datetime-modal');
            modal.classList.add('hidden'); modal.classList.remove('flex');
        }

        function saveBulkDateTimeModal() {
            const dateVal = document.getElementById('bulk_modal_date').value;
            const timeVal = document.getElementById('bulk_modal_time').value;
            let result = dateVal ? `${dateVal} ${timeVal || '00:00'}` : '';
            hotBulkInstance.setDataAtCell(currentModalRow, currentModalProp, result);
            closeBulkDateTimeModal();
        }

        // 🌟 แสดงรูปแบบ YYYY-MM-DD HH:mm เพื่อบอกวิธีพิมพ์/ก๊อปปี้วาง 🌟
        function renderClickableBulkTimeCell(instance, td, row, col, prop, value) {
            Handsontable.renderers.TextRenderer.apply(this, arguments);
            const headerTitle = instance.getColHeader(col);
            
            td.innerHTML = `
                <div class="flex items-center justify-between w-full h-full group pl-1">
                    <span class="truncate ${value ? 'font-bold text-blue-700' : 'text-slate-400 italic text-xs'}">${value ? value : '-- YYYY-MM-DD HH:mm --'}</span>
                    <button onclick="openBulkDateTimeModal(${row}, ${col}, '${headerTitle}')" class="hidden group-hover:flex bg-blue-100 text-blue-600 hover:bg-blue-200 rounded p-1 shadow-sm h-[22px] w-[22px] items-center justify-center cursor-pointer transition-colors" title="คลิกเพื่อเลือกวัน/เวลาจากปฏิทิน">
                        <i class="fa-solid fa-clock text-[10px]"></i>
                    </button>
                </div>
            `;
            td.style.verticalAlign = 'middle'; 
            td.style.padding = '0';
        }

        function getBulkHeaders(mode) {
            const commonCols = [
                { title: 'สถานะเซฟ', readOnly: true, className: 'htCenter htMiddle font-bold text-lg' },
                { title: 'วันที่วิ่งงาน\n(YYYY-MM-DD)', type: 'date', dateFormat: 'YYYY-MM-DD' },
                { title: 'ชื่องาน', type: 'text', className: 'font-bold text-primary' }, 
                { title: 'จำนวนตู้', type: 'numeric' },
                { title: 'ลูกค้า', type: 'text', readOnly: true, className: 'text-slate-500 font-bold bg-slate-50' },
                { title: 'Job Type', type: 'dropdown', source: ['Domestic', 'CONTAINER'] },
                { title: 'Agent', type: 'text' },
                { title: 'ต้นทาง', type: 'text' },
                { title: 'ปลายทาง', type: 'text' },
                { title: 'Booking/BL', type: 'text' },
                { title: 'ประเภทรถ', type: 'dropdown', source: ['6W', '10W', '12W*2', 'เงินสด'] },
                { title: 'ค่าเที่ยว', type: 'numeric', numericFormat: { pattern: '0,0' }, className: 'text-green-700 font-bold bg-green-50/30' },
                { title: 'ค่าขนส่ง', type: 'numeric', numericFormat: { pattern: '0,0' }, className: 'text-blue-700 font-bold bg-blue-50/30' }
            ];

            let timeCols = [];
            if (mode === 'EXPORT') {
                timeCols = [
                    { title: 'CY Date & Time\n(YYYY-MM-DD HH:mm)', renderer: renderClickableBulkTimeCell },
                    { title: 'VGM Cutoff (Time)\n(YYYY-MM-DD HH:mm)', renderer: renderClickableBulkTimeCell },
                    { title: 'Cutoff Time\n(YYYY-MM-DD HH:mm)', renderer: renderClickableBulkTimeCell },
                    { title: 'Load Date & Time\n(YYYY-MM-DD HH:mm)', renderer: renderClickableBulkTimeCell },
                    { title: 'Open Gate Date & Time\n(YYYY-MM-DD HH:mm)', renderer: renderClickableBulkTimeCell }
                ];
            } else if (mode === 'IMPORT') {
                timeCols = [
                    { title: 'CY Date & Time\n(YYYY-MM-DD HH:mm)', renderer: renderClickableBulkTimeCell },
                    { title: 'Rent Cutoff (Time)\n(YYYY-MM-DD HH:mm)', renderer: renderClickableBulkTimeCell },
                    { title: 'Demurrage (Time)\n(YYYY-MM-DD HH:mm)', renderer: renderClickableBulkTimeCell },
                    { title: 'Unload Date & Time\n(YYYY-MM-DD HH:mm)', renderer: renderClickableBulkTimeCell },
                    { title: 'Return Date & Time\n(YYYY-MM-DD HH:mm)', renderer: renderClickableBulkTimeCell }
                ];
            }
            return [...commonCols, ...timeCols];
        }

        function initBulkTable(dataToLoad = null, userSettings = {}) {
            const container = document.getElementById('hot-bulk-container');
            if (!container) return; 
            if (hotBulkInstance) { hotBulkInstance.destroy(); }
            
            const mode = document.getElementById('bulk-mode').value;
            const columnsConfig = getBulkHeaders(mode);
            const headers = columnsConfig.map(c => c.title);

            const initialData = dataToLoad || Array.from({ length: 15 }, () => new Array(headers.length).fill(""));

            hotBulkInstance = new Handsontable(container, {
                data: initialData,
                colHeaders: headers,
                columns: columnsConfig,
                rowHeaders: true,
                width: '100%',
                height: '100%',
                stretchH: 'all',
                minSpareRows: 3,
                
                manualColumnResize: true,
                manualColumnMove: true,
                colWidths: (userSettings.columnWidths && userSettings.columnWidths.length === headers.length) ? userSettings.columnWidths : undefined, 
                
                contextMenu: ['row_above', 'row_below', 'remove_row', 'undo', 'redo', 'copy', 'cut'],
                licenseKey: 'non-commercial-and-evaluation',

                afterChange: function(changes, source) {
                    if (source === 'loadData' || !changes) return;
                    
                    changes.forEach(([row, prop, oldVal, newVal]) => {
                        if (oldVal === newVal) return;
                        
                        const colName = this.getColHeader(prop);
                        const headersNow = this.getColHeader(); 
                        
                        const custIdx = headersNow.indexOf('ลูกค้า');
                        const jobTypeIdx = headersNow.indexOf('Job Type');
                        const originIdx = headersNow.indexOf('ต้นทาง');
                        const destIdx = headersNow.indexOf('ปลายทาง');
                        const carTypeIdx = headersNow.indexOf('ประเภทรถ');
                        const tripIdx = headersNow.indexOf('ค่าเที่ยว');
                        const transIdx = headersNow.indexOf('ค่าขนส่ง');
                        const jobNameIdx = headersNow.indexOf('ชื่องาน');

                        if (colName === 'ชื่องาน' && newVal) {
                            const rate = rateDataMap[newVal.trim()];
                            if (rate) {
                                if(custIdx >= 0) this.setDataAtCell(row, custIdx, rate.customer || '', 'auto');
                                if(jobTypeIdx >= 0) this.setDataAtCell(row, jobTypeIdx, rate.jobType || '', 'auto');
                                if(originIdx >= 0) this.setDataAtCell(row, originIdx, rate.origin || '', 'auto');
                                if(destIdx >= 0) this.setDataAtCell(row, destIdx, rate.dest || '', 'auto');
                                
                                if(carTypeIdx >= 0) {
                                    const carType = this.getDataAtCell(row, carTypeIdx);
                                    if (carType) applyRateDynamically(this, row, rate, carType, tripIdx, transIdx);
                                }
                            }
                        }
                        
                        if (colName === 'ประเภทรถ' && newVal) {
                            if(jobNameIdx >= 0) {
                                const jobName = this.getDataAtCell(row, jobNameIdx); 
                                if (jobName && rateDataMap[jobName.trim()]) {
                                    applyRateDynamically(this, row, rateDataMap[jobName.trim()], newVal, tripIdx, transIdx);
                                }
                            }
                        }
                    });
                }
            });
            
            if (userSettings.columnPositions && userSettings.columnPositions.length === headers.length) {
                try { hotBulkInstance.getPlugin('manualColumnMove').moveColumns(userSettings.columnPositions, 0); } catch(e) {}
            }
        }

        function applyRateDynamically(hot, row, rate, type, tripIdx, transIdx) {
            if(tripIdx < 0 || transIdx < 0) return;
            if(type === '6W') { hot.setDataAtCell(row, tripIdx, rate.trp6||''); hot.setDataAtCell(row, transIdx, rate.trn6||''); }
            else if(type === '10W') { hot.setDataAtCell(row, tripIdx, rate.trp10||''); hot.setDataAtCell(row, transIdx, rate.trn10||''); }
            else if(type === '12W*2') { hot.setDataAtCell(row, tripIdx, rate.trp12||''); hot.setDataAtCell(row, transIdx, rate.trn12||''); }
            else if(type === 'เงินสด') { hot.setDataAtCell(row, tripIdx, rate.trpCash||''); hot.setDataAtCell(row, transIdx, rate.trnCash||''); }
        }

        // 🌟 ใส่รูปแบบตัวอย่างข้อมูลลงในไฟล์ Excel 🌟
        function downloadExcelTemplate() {
            const mode = document.getElementById('bulk-mode').value;
            const headers = getBulkHeaders(mode).map(c => c.title.replace('\n', ' ')).slice(1);
            
            let sampleRow1 = new Array(headers.length).fill('');
            const setVal = (rowArr, name, val) => { 
                const idx = headers.findIndex(h => h.includes(name));
                if(idx >= 0) rowArr[idx] = val; 
            };

            const today = new Date().toISOString().slice(0, 10);
            
            setVal(sampleRow1, 'วันที่วิ่งงาน', today);
            setVal(sampleRow1, 'ชื่องาน', 'ตัวอย่างงานที่ 1');
            setVal(sampleRow1, 'จำนวนตู้', 1);
            setVal(sampleRow1, 'ลูกค้า', 'ระบบเติมอัตโนมัติ');
            setVal(sampleRow1, 'ประเภทรถ', '10W');
            
            if (mode === 'EXPORT') {
                setVal(sampleRow1, 'CY Date & Time', `${today} 08:30`);
                setVal(sampleRow1, 'VGM Cutoff', `${today} 12:00`);
                setVal(sampleRow1, 'Cutoff Time', `${today} 17:00`);
            } else {
                setVal(sampleRow1, 'CY Date & Time', `${today} 08:30`);
                setVal(sampleRow1, 'Rent Cutoff', `${today} 12:00`);
            }

            const ws = XLSX.utils.aoa_to_sheet([headers, sampleRow1]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, `Template_${mode}`);
            XLSX.writeFile(wb, `TMS_Bulk_Template_${mode}.xlsx`);
        }

        function uploadExcelFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const rawJson = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                if (rawJson.length <= 1) return;
                const formattedRows = rawJson.slice(1).map(row => ["", ...row]);
                initBulkTable(formattedRows, currentUserSettings);
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        async function processBulkSave() {
            if (!hotBulkInstance) return;
            const btn = document.getElementById('btn-save-bulk');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...';
            btn.disabled = true;

            const data = hotBulkInstance.getData();
            const mode = document.getElementById('bulk-mode').value;
            const headers = hotBulkInstance.getColHeader();

            const getVal = (r, name) => {
                const idx = headers.findIndex(h => h.includes(name));
                return idx >= 0 ? data[r][idx] : '';
            };

            let successCount = 0; let failCount = 0;

            for (let r = 0; r < data.length; r++) {
                const runDate = getVal(r, 'วันที่วิ่งงาน');
                const jobName = getVal(r, 'ชื่องาน');
                const customer = getVal(r, 'ลูกค้า');
                
                if (!runDate || !jobName) continue; 

                let bData = {
                    mode: mode,
                    run_date: runDate,
                    job_name: jobName, 
                    container_count: parseInt(getVal(r, 'จำนวนตู้')) || 1, 
                    customer_name: customer, 
                    job_type: getVal(r, 'Job Type'),
                    agent: getVal(r, 'Agent'),
                    origin: getVal(r, 'ต้นทาง'),
                    destination: getVal(r, 'ปลายทาง'),
                    booking_no: getVal(r, 'Booking/BL') || `BK-BULK-${Date.now().toString().slice(-5)}${r}`,
                    price_type: getVal(r, 'ประเภทรถ'),
                    trip_fee: getVal(r, 'ค่าเที่ยว') || 0,
                    trans_fee: getVal(r, 'ค่าขนส่ง') || 0
                };

                if (mode === 'EXPORT') {
                    bData.cy_date = getVal(r, 'CY Date & Time');
                    bData.vgm_cutoff = getVal(r, 'VGM Cutoff');
                    bData.cutoff_time = getVal(r, 'Cutoff Time');
                    bData.load_date = getVal(r, 'Load Date & Time');
                    bData.open_gate = getVal(r, 'Open Gate') || getVal(r, 'Gate Date & Time');
                } else {
                    bData.cy_date = getVal(r, 'CY Date & Time');
                    bData.rent_cutoff = getVal(r, 'Rent Cutoff');
                    bData.demurrage = getVal(r, 'Demurrage');
                    bData.unload_date = getVal(r, 'Unload Date & Time');
                    bData.return_date = getVal(r, 'Return Date & Time');
                }

                try {
                    const res = await fetch('/api/bookings/header', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bData)
                    });
                    const result = await res.json();
                    
                    if (result.success) {
                        hotBulkInstance.setDataAtCell(r, 0, '✅ สำเร็จ', 'auto');
                        hotBulkInstance.getCellMeta(r, 0).className = 'htCenter htMiddle font-bold text-green-600 bg-green-50';
                        successCount++;
                    } else {
                        hotBulkInstance.setDataAtCell(r, 0, '❌ พลาด', 'auto');
                        hotBulkInstance.getCellMeta(r, 0).className = 'htCenter htMiddle font-bold text-red-600 bg-red-50';
                        failCount++;
                    }
                } catch (err) {
                    hotBulkInstance.setDataAtCell(r, 0, '❌ ล้มเหลว', 'auto');
                    hotBulkInstance.getCellMeta(r, 0).className = 'htCenter htMiddle font-bold text-red-600 bg-red-50';
                    failCount++;
                }
            }
            
            hotBulkInstance.render();
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> บันทึกข้อมูลทุก Job';
            btn.disabled = false;
            alert(`สรุปผลการนำเข้า: \n✅ สำเร็จ ${successCount} บุคกิ้ง\n❌ ล้มเหลว ${failCount} บุคกิ้ง`);
        };
    </script>
</body>
</html>
