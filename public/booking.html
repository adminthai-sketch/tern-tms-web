<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - สร้างบุคกิ้ง (Booking Header)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col">

    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-truck-fast"></i></div>
            <span class="font-bold text-xl text-primary tracking-wide">TERN TMS <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold ml-1">OPERATION</span></span>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='/index.html'" class="text-slate-500 hover:text-primary font-medium text-sm flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg transition-colors border border-slate-200">
                <i class="fa-solid fa-arrow-left"></i> กลับหน้าแรก
            </button>
            <div class="text-right hidden sm:block">
                <div id="user-fullname" class="text-sm font-bold text-slate-700">กำลังโหลด...</div>
                <div id="user-role-badge" class="inline-block px-2 py-0.5 mt-0.5 text-[10px] font-bold rounded-full bg-slate-100 text-slate-500">ROLE</div>
            </div>
        </div>
    </header>

    <div class="flex-1 overflow-y-auto p-6 flex flex-col relative bg-bglight items-center">
        
        <div class="bg-white rounded-xl shadow-md border border-slate-200 p-8 w-full max-w-4xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
                <h2 class="text-xl font-bold text-primary flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus"></i> ส่วนที่ 1: คีย์เปิดบุคกิ้งใหม่ (Create Booking Header)
                </h2>
            </div>
            
            <form id="booking-header-form" onsubmit="submitBookingHeader(event)">
                <div class="bg-blue-50/50 p-6 rounded-xl border border-blue-100 mb-6 space-y-5">
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div>
                            <label class="block text-sm font-bold text-primary mb-1">🌐 เลือกลักษณะงาน (MODE)</label>
                            <select id="pMode" required class="w-full px-4 py-2.5 border border-blue-300 rounded-lg text-primary font-bold focus:outline-none focus:ring-2 focus:ring-primary shadow-sm bg-white text-sm">
                                <option value="">-- กรุณาเลือก Mode --</option>
                                <option value="EXPORT">🚢 EXPORT (ขาออก)</option>
                                <option value="IMPORT">🛬 IMPORT (ขาเข้า)</option>
                                <option value="TRANSFER">🚚 TRANSFER (ขนถ่าย)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">📅 วันที่วิ่งงาน</label>
                            <input type="date" id="runDate" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm shadow-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-primary mb-1">จำนวนตู้ที่จะสร้าง (ใบ)</label>
                            <input type="number" id="containerCount" value="1" min="1" required class="w-full px-4 py-2.5 border border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm font-bold text-center shadow-sm bg-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">🔍 ชื่องาน (Job Name)</label>
                            <input type="text" id="jobName" placeholder="ระบุชื่องาน..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm shadow-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">🏢 ชื่อลูกค้า (Customer)</label>
                            <input type="text" id="customerName" placeholder="ระบุชื่อลูกค้า..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm shadow-sm bg-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">📑 เลข Booking / BL No.</label>
                            <input type="text" id="bookingNo" placeholder="ระบุเลข Booking..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm shadow-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">📍 ต้นทาง (Origin)</label>
                            <input type="text" id="origin" placeholder="ระบุต้นทาง..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm shadow-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">🏁 ปลายทาง (Destination)</label>
                            <input type="text" id="destination" placeholder="ระบุปลายทาง..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm shadow-sm bg-white">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end pt-2">
                    <button type="submit" id="btn-submit" class="bg-primary hover:bg-blue-900 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all flex items-center gap-2">
                        <i class="fa-solid fa-save"></i>
                        <span>บันทึกหัวบุคกิ้ง (Save Booking)</span>
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- Alert Toast -->
    <div id="toast" class="hidden fixed bottom-8 right-8 p-4 rounded-xl shadow-xl text-white font-semibold flex items-center gap-3 transition-all z-50"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('tms_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                document.getElementById('user-fullname').innerText = user.fullName || 'User';
                document.getElementById('user-role-badge').innerText = (user.role || 'USER').toUpperCase();
            }
            document.getElementById('runDate').valueAsDate = new Date();
        });

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fa-solid ${isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation'} text-xl"></i> <span>${message}</span>`;
            toast.className = `fixed bottom-8 right-8 p-4 rounded-xl shadow-xl text-white font-semibold flex items-center gap-3 transition-all z-50 ${isSuccess ? 'bg-emerald-600' : 'bg-red-600'}`;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 4000);
        }

        async function submitBookingHeader(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btn-submit');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...';

            const bookingData = {
                mode: document.getElementById('pMode').value,
                run_date: document.getElementById('runDate').value,
                container_count: parseInt(document.getElementById('containerCount').value) || 1,
                job_name: document.getElementById('jobName').value.trim(),
                customer_name: document.getElementById('customerName').value.trim(),
                booking_no: document.getElementById('bookingNo').value.trim() || `TEMP-${Date.now()}`,
                origin: document.getElementById('origin').value.trim(),
                destination: document.getElementById('destination').value.trim()
            };

            try {
                const response = await fetch('/api/bookings/header', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showToast(result.message, true);
                    document.getElementById('bookingNo').value = '';
                    document.getElementById('jobName').value = '';
                } else {
                    showToast('เกิดข้อผิดพลาด: ' + (result.message || 'บันทึกไม่สำเร็จ'), false);
                }
            } catch (error) {
                showToast('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้: ' + error.message, false);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
