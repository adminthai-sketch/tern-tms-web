<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - ลงเบอร์ตู้ (Manage Containers)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>

    <!-- Handsontable (Excel Grid) -->
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>

    <style>
        .handsontable th { font-weight: 600 !important; font-size: 11px !important; background: #f1f5f9; color: #334155; }
        .handsontable td { font-size: 12px !important; vertical-align: middle; }
        .ht-edited-row { background-color: #fef9c3 !important; }
    </style>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col">

    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-4 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-4">
            <span class="font-bold text-lg text-primary tracking-wide hidden sm:flex items-center gap-2">
                <i class="fa-solid fa-boxes-stacked"></i> ลงเบอร์ตู้ (Containers)
            </span>
            <div class="flex gap-1 ml-0 sm:ml-2 sm:border-l sm:border-slate-200 sm:pl-3">
                <a href="/booking.html" class="text-slate-500 hover:text-primary hover:bg-blue-50 px-3 py-1.5 rounded-lg font-bold text-xs transition-colors"><i class="fa-solid fa-pen-to-square mr-1"></i> สร้างรับงาน</a>
                <a href="/booking-list.html" class="text-slate-500 hover:bg-slate-50 px-3 py-1.5 rounded-lg font-bold text-xs transition-colors"><i class="fa-solid fa-table-list mr-1"></i> รายการบุคกิ้ง</a>
                <a href="/booking-manage.html" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm"><i class="fa-solid fa-boxes-stacked mr-1"></i> ลงเบอร์ตู้</a>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-1"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <main class="flex-1 p-3 overflow-hidden flex flex-col gap-2">
        <!-- 🎛️ Toolbar กรองข้อมูล -->
        <div class="bg-white px-3 py-2 rounded-lg shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-2 shrink-0 z-10">
            <div class="flex flex-wrap items-center gap-2">
                <div class="flex items-center gap-1.5 bg-emerald-50 px-2 py-1 rounded border border-emerald-200 h-8">
                    <label class="text-xs font-bold text-emerald-700 flex items-center gap-1"><i class="fa-regular fa-calendar-check"></i> เดือน:</label>
                    <input type="month" id="filter-month" onchange="loadContainerGridData()" class="px-1 py-0 border-none bg-transparent text-xs font-bold text-emerald-700 outline-none cursor-pointer">
                </div>
                <div class="w-px h-5 bg-slate-200 hidden md:block mx-1"></div>
                
                <select id="filter-run-date" onchange="onCascadeChange()" class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 cursor-pointer h-8 md:w-32"><option value="">-- วันที่วิ่งงาน --</option></select>
                <select id="filter-customer" onchange="onCascadeChange()" class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 cursor-pointer h-8 md:w-40"><option value="">-- ลูกค้า (Customer) --</option></select>
                <select id="filter-booking-no" onchange="applyFilters()" class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 cursor-pointer h-8 md:w-44"><option value="">-- ทุก Booking / BL --</option></select>
                <button onclick="clearQuickFilters()" class="text-slate-400 hover:text-slate-700 px-2 h-8"><i class="fa-solid fa-eraser text-xs"></i></button>
            </div>
            <div class="flex items-center gap-2">
                <span id="save-status-badge" class="text-[11px] font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full border border-slate-200 flex items-center gap-1"><i class="fa-solid fa-check text-emerald-500"></i> พร้อมใช้งาน</span>
                <span id="total-count" class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">0 รายการ</span>
                <button onclick="saveGridChanges()" id="btn-save-grid" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1 px-4 rounded shadow-sm flex items-center gap-1 text-xs transition-transform h-8"><i class="fa-solid fa-floppy-disk"></i> บันทึกตาราง</button>
            </div>
        </div>

        <!-- 📋 ตาราง (Handsontable) -->
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 flex-1 relative overflow-hidden">
            <div id="container-grid" class="absolute inset-0 z-0"></div>
        </div>
    </main>

    <script src="js/modules/booking/manage.js"></script>
    <script>function logout() { localStorage.removeItem('tms_user'); window.location.href = '/login.html'; }</script>
</body>
</html>
