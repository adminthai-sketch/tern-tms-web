<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - Admin Backoffice</title>
    
    <!-- ฟอนต์และไอคอน -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#0f4c81', bglight: '#f8fafc' } 
                } 
            } 
        }
    </script>

    <!-- Handsontable -->
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>

    <!-- ไฟล์ CSS หลัก -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col">

    <!-- 🟢 TOP HEADER -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-emerald-600 text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-shield-halved"></i></div>
            <span class="font-bold text-xl text-slate-800 tracking-wide">TERN TMS <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold ml-1">ADMIN BACKOFFICE</span></span>
        </div>
        
        <div class="flex items-center gap-4">
            <a href="/index.html" class="text-slate-500 hover:text-primary font-medium text-sm flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg transition-colors border border-slate-200">
                <i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก Operation
            </a>
            <div class="text-right hidden sm:block">
                <div id="user-fullname" class="text-sm font-bold text-slate-700">Admin</div>
                <div id="user-role-badge" class="inline-block px-2 py-0.5 mt-0.5 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-700">ADMIN</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-2" title="ออกจากระบบ"><i class="fa-solid fa-power-off text-lg"></i></button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- 🟢 SIDEBAR (ADMIN MENU) -->
        <nav class="w-64 bg-white border-r border-slate-200 flex flex-col py-6 shrink-0 overflow-y-auto z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
            <div class="px-6 mb-3 text-xs font-bold text-slate-400 uppercase tracking-wider">Master Data Tables</div>
            
            <a href="#" onclick="switchMasterTab('users')" id="menu-users" class="sidebar-item active flex items-center gap-3 px-6 py-3 bg-emerald-50 text-emerald-700 border-r-4 border-emerald-600 font-semibold">
                <i class="fa-solid fa-users w-5 text-center"></i> ผู้ใช้งานระบบ (Users)
            </a>
            <a href="#" onclick="switchMasterTab('drivers')" id="menu-drivers" class="sidebar-item flex items-center gap-3 px-6 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                <i class="fa-solid fa-id-card w-5 text-center"></i> คนขับและรถ (Drivers)
            </a>
            <a href="#" onclick="switchMasterTab('customers')" id="menu-customers" class="sidebar-item flex items-center gap-3 px-6 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                <i class="fa-solid fa-building w-5 text-center"></i> ข้อมูลลูกค้า (Customers)
            </a>
            <a href="#" onclick="switchMasterTab('rates')" id="menu-rates" class="sidebar-item flex items-center gap-3 px-6 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                <i class="fa-solid fa-hand-holding-dollar w-5 text-center"></i> เรทราคาค่าเที่ยว (Rates)
            </a>
        </nav>

        <!-- 🟢 MAIN WORKSPACE -->
        <main class="flex-1 p-6 overflow-hidden flex flex-col relative bg-bglight">
            <div class="h-full flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                    <div>
                        <h2 id="table-title" class="text-xl font-bold text-emerald-600 flex items-center gap-2">
                            <i class="fa-solid fa-users"></i> จัดการผู้ใช้งานระบบ (Users)
                        </h2>
                        <p id="table-desc" class="text-xs text-slate-400 mt-0.5">เพิ่ม แก้ไข และกำหนดสิทธิ์พนักงานผู้ใช้งานระบบ</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openColToggleModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2 px-4 rounded-lg flex items-center gap-2 text-sm transition-colors border border-slate-200">
                            <i class="fa-solid fa-eye"></i> ซ่อน/แสดงคอลัมน์
                        </button>
                        <button onclick="saveCurrentMaster()" id="btn-save-master" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg flex items-center gap-2 text-sm shadow-sm transition-colors">
                            <i class="fa-solid fa-floppy-disk"></i> บันทึกตารางนี้
                        </button>
                    </div>
                </div>

                <!-- Handsontable Container -->
                <div class="flex-1 relative w-full h-full overflow-hidden rounded-lg border border-slate-200">
                    <div id="hot-master-container" class="w-full h-full z-0 relative"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal ซ่อน/แสดงคอลัมน์ -->
    <div id="col-toggle-modal" class="hidden absolute inset-0 z-[60] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 text-lg"><i class="fa-solid fa-eye mr-2 text-emerald-600"></i> ซ่อน/แสดงคอลัมน์</h3>
                <button onclick="closeColToggleModal()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="col-toggle-container" class="p-6 grid grid-cols-2 gap-3 max-h-[60vh] overflow-y-auto bg-white"></div>
        </div>
    </div>

    <script>
        // --- 🔒 Guard: ตรวจสอบสิทธิ์ Admin ก่อนเข้าใช้งาน ---
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('tms_user');
            if (!savedUser) {
                window.location.href = '/login.html';
                return;
            }

            const user = JSON.parse(savedUser);
            if (user.role !== 'Admin') {
                alert('⛔ คุณไม่มีสิทธิ์เข้าถึงหน้า Admin Backoffice');
                window.location.href = '/index.html';
                return;
            }

            document.getElementById('user-fullname').innerText = user.fullName;
            switchMasterTab('users');
        });

        function logout() {
            localStorage.removeItem('tms_user');
            window.location.href = '/login.html';
        }

        // --- 📊 ตาราง Master Data & State Management ---
        let currentMasterType = 'users';
        let hotMasterInstance = null;

        const masterConfigs = {
            users: {
                title: 'จัดการผู้ใช้งานระบบ (Users)',
                icon: 'fa-users',
                desc: 'เพิ่ม แก้ไข และกำหนดสิทธิ์พนักงานผู้ใช้งานระบบ',
                endpoint: '/api/users',
                headers: ['ID', 'Username', 'ชื่อ-นามสกุล', 'อีเมล (รับ OTP)', 'สิทธิ์ (Role)', 'สถานะ (Status)'],
                columns: [
                    { readOnly: true }, { type: 'text' }, { type: 'text' }, { type: 'text' },
                    { type: 'dropdown', source: ['Admin', 'User'] }, { type: 'dropdown', source: ['ACTIVE', 'INACTIVE'] }
                ]
            },
            drivers: {
                title: 'จัดการคนขับและทะเบียนรถ (Drivers & Trucks)',
                icon: 'fa-id-card',
                desc: 'จัดการรายชื่อคนขับ ป้ายทะเบียน และประเภทรถขนส่ง',
                endpoint: '/api/drivers',
                headers: ['ป้ายทะเบียน', 'ประเภทรถ', 'ชื่อ.พนง.', 'ชื่อเล่น'],
                columns: [{ type: 'text' }, { type: 'dropdown', source: ['6W', '10W', '12W*2', 'เงินสด'] }, { type: 'text' }, { type: 'text' }]
            },
            customers: {
                title: 'จัดการข้อมูลลูกค้า (Customers)',
                icon: 'fa-building',
                desc: 'จัดการฐานข้อมูลลูกค้า ชื่อออกใบเสร็จ และเลขผู้เสียภาษี',
                endpoint: '/api/customers',
                headers: ['Customer No.', 'Customer Name', 'ชื่อลูกค้าย่อ', 'Billing Name', 'Phone Number', 'Address', 'Tax ID'],
                columns: Array(7).fill({ type: 'text' })
            },
            rates: {
                title: 'จัดการเรทราคาค่าเที่ยว (Rates & Pricing)',
                icon: 'fa-hand-holding-dollar',
                desc: 'กำหนดเรทค่าเที่ยวคนขับและค่าขนส่งประจำสายงาน',
                endpoint: '/api/rates',
                headers: ["ชื่องาน", "ลูกค้า", "ต้นทาง", "ปลายทาง", "วิ่งงาน", "จำนวนตู้/ใบ", "ประเภทงาน", "ค่าเที่ยว 6W", "ค่าเที่ยว 10W", "ค่าเที่ยว 12W*2", "ค่าเที่ยวเงินสด", "ค่าขนส่ง 6W", "ค่าขนส่ง 10W", "ค่าขนส่ง 12W*2", "งานเงินสด"],
                columns: Array(15).fill({ type: 'text' })
            }
        };

        function getUIState(tableName) {
            const user = JSON.parse(localStorage.getItem('tms_user'));
            if (!user) return {};
            return JSON.parse(localStorage.getItem(`tms_ui_${tableName}_${user.username}`)) || {};
        }

        function saveUIState(tableName, stateData) {
            const user = JSON.parse(localStorage.getItem('tms_user'));
            if (!user) return;
            const key = `tms_ui_${tableName}_${user.username}`;
            const existing = getUIState(tableName);
            localStorage.setItem(key, JSON.stringify({ ...existing, ...stateData }));
        }

        async function switchMasterTab(type) {
            currentMasterType = type;
            const cfg = masterConfigs[type];

            // ปรับชื่อ Header
            document.getElementById('table-title').innerHTML = `<i class="fa-solid ${cfg.icon}"></i> ${cfg.title}`;
            document.getElementById('table-desc').innerText = cfg.desc;

            // แต่ง Sidebar Active
            document.querySelectorAll('.sidebar-item').forEach(b => {
                b.classList.remove('bg-emerald-50', 'text-emerald-700', 'border-r-4', 'border-emerald-600', 'font-semibold');
                b.classList.add('text-slate-600');
            });
            const activeBtn = document.getElementById('menu-' + type);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-600');
                activeBtn.classList.add('bg-emerald-50', 'text-emerald-700', 'border-r-4', 'border-emerald-600', 'font-semibold');
            }

            try {
                const response = await fetch(cfg.endpoint);
                const result = await response.json();
                
                const container = document.getElementById('hot-master-container');
                if (hotMasterInstance) hotMasterInstance.destroy();

                let safeData = (result.data && result.data.length > 0) ? result.data : [new Array(cfg.headers.length).fill("")];
                const uiState = getUIState('master_' + type);

                hotMasterInstance = new Handsontable(container, {
                    data: safeData,
                    colHeaders: cfg.headers,
                    columns: cfg.columns,
                    rowHeaders: true,
                    minSpareRows: 1,
                    width: '100%',
                    height: '100%',
                    manualColumnResize: true,
                    manualColumnMove: true,
                    hiddenColumns: { columns: uiState.hiddenColumns || [], indicators: true },
                    colWidths: uiState.colWidths || undefined,
                    stretchH: type === 'rates' ? 'all' : 'none',
                    licenseKey: 'non-commercial-and-evaluation',
                    afterColumnResize: function(newSize, column) {
                        saveUIState('master_' + currentMasterType, { colWidths: this.getPlugin('manualColumnResize').manualColumnWidths });
                    }
                });
            } catch (err) {
                alert('❌ โหลดข้อมูลไม่สำเร็จ: ' + err.message);
            }
        }

        async function saveCurrentMaster() {
            if (!hotMasterInstance) return;
            const btn = document.getElementById('btn-save-master');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...';
            btn.disabled = true;

            const cfg = masterConfigs[currentMasterType];
            const cleanData = hotMasterInstance.getData().filter(r => r.some(c => c !== null && c !== ''));

            try {
                const response = await fetch(cfg.endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: cleanData })
                });
                const result = await response.json();
                if (result.success) {
                    alert('✅ ' + result.message);
                    switchMasterTab(currentMasterType);
                } else {
                    alert('❌ เกิดข้อผิดพลาด: ' + result.message);
                }
            } catch (err) {
                alert('❌ บันทึกข้อมูลไม่สำเร็จ: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // --- 🎛️ Modal ซ่อน/แสดงคอลัมน์ ---
        function openColToggleModal() {
            if (!hotMasterInstance) return;
            const cfg = masterConfigs[currentMasterType];
            const plugin = hotMasterInstance.getPlugin('hiddenColumns');
            const hiddenCols = plugin.getHiddenColumns() || [];
            
            let html = '';
            cfg.headers.forEach((header, index) => {
                const isChecked = !hiddenCols.includes(index) ? 'checked' : '';
                html += `
                    <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 hover:bg-emerald-50 cursor-pointer transition-colors">
                        <input type="checkbox" class="w-5 h-5 accent-emerald-600 rounded" ${isChecked} onchange="toggleMasterColumn(${index}, this.checked)">
                        <span class="font-medium text-slate-700 text-sm">${header}</span>
                    </label>
                `;
            });
            document.getElementById('col-toggle-container').innerHTML = html;
            document.getElementById('col-toggle-modal').classList.remove('hidden');
        }

        function closeColToggleModal() {
            document.getElementById('col-toggle-modal').classList.add('hidden');
        }

        function toggleMasterColumn(colIndex, isVisible) {
            const plugin = hotMasterInstance.getPlugin('hiddenColumns');
            if (isVisible) plugin.showColumns([colIndex]);
            else plugin.hideColumns([colIndex]);
            
            hotMasterInstance.render();
            saveUIState('master_' + currentMasterType, { hiddenColumns: plugin.getHiddenColumns() || [] });
        }
    </script>
</body>
</html>
