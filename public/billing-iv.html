<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการ IV - TERN TMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } } }</script>
    <link href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .tab-btn-active { background-color: #8b5cf6; color: white; font-weight: bold; border-color: #7c3aed; }
        .tab-btn-inactive { background-color: #f1f5f9; color: #64748b; font-weight: 600; transition: all 0.2s; }
        .tab-btn-inactive:hover { background-color: #e2e8f0; color: #334155; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-6 shrink-0 shadow-sm z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-purple-600 text-white rounded-lg flex items-center justify-center text-sm shadow-sm"><i class="fa-solid fa-file-invoice-dollar"></i></div>
            <span class="font-bold text-lg text-slate-800">ระบบวางบิล & บัญชี</span>
            <div class="h-5 w-px bg-slate-300 mx-2"></div>
            
            <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs gap-1">
                <a href="/billing.html" class="tab-btn-inactive px-3 py-1.5 rounded-md flex items-center gap-1.5"><i class="fa-solid fa-list-check"></i> 1. หน้ารายการ Booking</a>
                <a href="/billing-detail.html" class="tab-btn-inactive px-3 py-1.5 rounded-md flex items-center gap-1.5"><i class="fa-solid fa-file-lines"></i> 2. รายละเอียดตู้/เปิดบิล</a>
                <a href="/billing-iv.html" class="tab-btn-active px-3 py-1.5 rounded-md flex items-center gap-1.5"><i class="fa-solid fa-receipt"></i> 3. รายการ IV (ใบแจ้งหนี้)</a>
            </div>
            <div class="h-5 w-px bg-slate-300 mx-2"></div>
            <a href="/index.html" class="text-slate-500 hover:text-slate-800 font-semibold text-xs flex items-center gap-1"><i class="fa-solid fa-house"></i> หน้าแรก</a>
        </div>
        <div class="flex items-center gap-4">
            <div id="user-fullname" class="text-xs font-bold text-slate-700">Loading...</div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 p-2"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <div class="bg-white border-b border-slate-200 px-6 py-2 shrink-0 shadow-sm z-40 flex flex-wrap items-center gap-2 text-xs">
        <div class="flex items-center bg-slate-100 border border-slate-300 rounded-lg overflow-hidden mr-2">
            <div class="px-3 py-1.5 bg-slate-200 border-r border-slate-300 text-slate-600 font-bold"><i class="fa-regular fa-calendar-check text-purple-600"></i> เดือน:</div>
            <input type="month" id="filter-month" onchange="loadIvSummaryData()" class="px-3 py-1.5 outline-none font-bold text-slate-700 bg-transparent cursor-pointer">
        </div>
        <input type="text" id="filter-iv-search" placeholder="🔍 ค้นหาเลข IV, ชื่อลูกค้า..." class="border border-slate-300 rounded-lg px-3 py-1.5 w-64 outline-none focus:border-purple-400" onkeyup="filterIvGrid()">
        <div class="flex-1"></div>
        <button onclick="loadIvSummaryData()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-4 py-1.5 rounded-lg border text-xs shadow-sm"><i class="fa-solid fa-rotate"></i> ดึงข้อมูล</button>
    </div>

    <div class="flex-1 overflow-hidden relative p-4">
        <div id="iv-loading-overlay" class="absolute inset-0 bg-white/80 z-50 flex flex-col items-center justify-center hidden backdrop-blur-sm"><i class="fa-solid fa-spinner fa-spin text-3xl text-purple-600 mb-2"></i></div>
        <div id="iv-grid-container" class="w-full h-full bg-white rounded-xl shadow-sm border border-slate-200"></div>
    </div>

    <script src="/js/modules/billing/iv.js"></script>
    <script>function logout() { localStorage.removeItem('tms_user'); window.location.href = '/login.html'; }</script>
</body>
</html>
