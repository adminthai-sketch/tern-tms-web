<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - จัดรถ & ลงเบอร์ตู้</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>

    <!-- Handsontable & Datepicker -->
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pikaday@1.8.2/pikaday.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/pikaday@1.8.2/css/pikaday.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col relative">

    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-4 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-4">
            <span class="font-bold text-lg text-emerald-700 tracking-wide hidden sm:flex items-center gap-2">
                <i class="fa-solid fa-truck-fast"></i> จัดรถ & ลงเบอร์ตู้
            </span>
            <div class="flex gap-1 ml-0 sm:ml-2 sm:border-l sm:border-slate-200 sm:pl-3">
                <a href="/index.html" class="text-slate-500 hover:text-primary hover:bg-slate-50 px-3 py-1.5 rounded-lg font-bold text-xs transition-colors"><i class="fa-solid fa-house mr-1"></i> หน้าแรก</a>
                <a href="/booking.html" class="text-slate-500 hover:text-primary hover:bg-slate-50 px-3 py-1.5 rounded-lg font-bold text-xs transition-colors"><i class="fa-solid fa-pen-to-square mr-1"></i> สร้างรับงาน</a>
                <a href="/booking-list.html" class="text-slate-500 hover:text-primary hover:bg-slate-50 px-3 py-1.5 rounded-lg font-bold text-xs transition-colors"><i class="fa-solid fa-table-list mr-1"></i> รายการบุคกิ้ง</a>
                <a href="/booking-manage.html" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm"><i class="fa-solid fa-desktop mr-1"></i> จัดการตู้</a>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="user-fullname" class="text-xs font-bold text-slate-700 hidden md:block">กำลังโหลด...</div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-1"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <main class="flex-1 p-3 overflow-hidden flex flex-col gap-2 relative">
        <div class="bg-white px-3 py-2 rounded-lg shadow-sm border border-slate-200 flex flex-col gap-2 shrink-0 z-10">
            <!-- แถวบน: ตัวกรอง -->
            <div class="flex flex-wrap justify-between items-center gap-2">
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex items-center gap-1.5 bg-emerald-50 px-2 py-1 rounded border border-emerald-200 h-8">
                        <label class="text-xs font-bold text-emerald-700 flex items-center gap-1"><i class="fa-regular fa-calendar-check"></i> เดือน:</label>
                        <input type="month" id="filter-month" onchange="loadManageData()" class="px-1 py-0 border-none bg-transparent text-xs font-bold text-emerald-700 outline-none cursor-pointer">
                    </div>
                    
                    <input type="text" id="filter-run-date" list="dl-run-date" onchange="handleManageFilter()" placeholder="📅 วันที่วิ่งงาน..." class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 h-8 w-32 focus:bg-white focus:border-emerald-500">
                    <datalist id="dl-run-date"></datalist>

                    <input type="text" id="filter-customer" list="dl-customer" onchange="handleManageFilter()" placeholder="🏢 ชื่องาน/ลูกค้า..." class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 h-8 w-44 focus:bg-white focus:border-emerald-500">
                    <datalist id="dl-customer"></datalist>

                    <input type="text" id="filter-booking-no" list="dl-booking-no" onchange="handleManageFilter()" placeholder="📝 เลข Booking..." class="px-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-slate-50 h-8 w-32 focus:bg-white focus:border-emerald-500">
                    <datalist id="dl-booking-no"></datalist>

                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-2 top-2.5 text-slate-400 text-xs"></i>
                        <input type="text" id="global-search" onkeyup="applyManageFilters()" placeholder="ค้นหาเบอร์ตู้..." class="pl-7 pr-2 py-1 border border-slate-300 rounded text-xs font-medium outline-none bg-white h-8 w-48 focus:border-emerald-500 shadow-sm">
                    </div>
                    <button onclick="clearManageFilters()" class="text-slate-400 hover:text-red-500 px-2 h-8 transition-colors"><i class="fa-solid fa-eraser text-sm"></i></button>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="saveGridSettings()" class="bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold py-1 px-3 rounded text-xs flex items-center gap-1 border border-amber-300 h-8 shadow-sm">
                        <i class="fa-solid fa-table-columns"></i> จำมุมมอง
                    </button>
                    <button onclick="deleteSelectedRows()" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-1 px-3 rounded text-xs flex items-center gap-1 border border-red-200 h-8 shadow-sm">
                        <i class="fa-solid fa-trash-can"></i> ลบตู้
                    </button>
                    <button onclick="addNewContainerRow()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-1 px-3 rounded text-xs flex items-center gap-1 border border-blue-200 h-8 shadow-sm">
                        <i class="fa-solid fa-plus"></i> เพิ่มตู้เข้า Booking
                    </button>
                    <button onclick="saveManageChanges()" id="btn-save-grid" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1 px-4 rounded flex items-center gap-1 text-xs h-8 shadow-sm">
                        <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล
                    </button>
                </div>
            </div>
            
            <!-- แถวล่าง: Quick Filters -->
            <div class="flex items-center gap-2 text-xs border-t border-slate-100 pt-2">
                <span class="font-bold text-slate-500"><i class="fa-solid fa-bolt text-amber-500"></i> ตัวกรองด่วน:</span>
                <button id="qf-pending" onclick="setQuickFilter('pending')" class="px-3 py-1 rounded-full border border-slate-300 bg-white hover:bg-blue-50 hover:text-blue-600 font-medium text-slate-600 transition-colors shadow-sm">รอลงเบอร์ตู้</button>
                <button id="qf-filled" onclick="setQuickFilter('filled')" class="px-3 py-1 rounded-full border border-slate-300 bg-white hover:bg-blue-50 hover:text-blue-600 font-medium text-slate-600 transition-colors shadow-sm">ลงเบอร์ตู้แล้ว</button>
                
                <span id="save-status-badge" class="ml-auto font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full border border-slate-200 flex items-center gap-1"><i class="fa-solid fa-check text-emerald-500"></i> อัปเดตล่าสุดแล้ว</span>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-slate-200 flex-1 relative overflow-hidden">
            <div id="loading-overlay" class="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-600 mb-3"></i>
                <p class="font-bold text-slate-600">กำลังโหลดข้อมูลตู้...</p>
            </div>
            <div id="manage-grid-container" class="absolute inset-0 z-0"></div>
        </div>
    </main>

    <!-- 🌟 Pop-up Modal สำหรับจัดการเส้นทางฝากตู้ (Drop Yard Timeline) 🌟 -->
    <div id="drop-yard-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[60] hidden items-center justify-center opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="drop-yard-modal-content">
            <!-- Header -->
            <div class="bg-purple-50 px-5 py-4 border-b border-purple-100 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-purple-900 text-lg flex items-center gap-2"><i class="fa-solid fa-route"></i> จัดการเส้นทาง & ลานฝากตู้</h3>
                    <p class="text-xs text-purple-600 mt-1 font-medium">เพิ่มจุดแวะพักตู้ และเปลี่ยนข้อมูลรถ/คนขับมารับช่วงต่อ</p>
                </div>
                <button onclick="closeTimelineModal()" class="text-slate-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <!-- Body: Timeline -->
            <div class="p-5 max-h-[60vh] overflow-y-auto bg-slate-50">
                <div class="relative pl-6 border-l-2 border-purple-200 space-y-6" id="timeline-container">
                    
                    <!-- จุดที่ 1: รับตู้ -->
                    <div class="relative">
                        <div class="absolute -left-[31px] top-1 w-4 h-4 bg-white border-2 border-emerald-500 rounded-full z-10 shadow-sm"></div>
                        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-wide">1. ต้นทาง (ไปรับตู้)</span>
                            <div class="mt-2 flex gap-2">
                                <input type="text" placeholder="ทะเบียนรถ..." class="w-1/3 px-2 py-1.5 border border-slate-300 rounded text-xs bg-slate-100" readonly value="ดึงจากตารางหลัก">
                                <input type="text" placeholder="คนขับรถ..." class="w-2/3 px-2 py-1.5 border border-slate-300 rounded text-xs bg-slate-100" readonly value="ดึงจากตารางหลัก">
                            </div>
                        </div>
                    </div>

                    <!-- จุดที่ 2: ลานฝากตู้ (ซ่อนไว้ รอแอดมินกดเพิ่ม) -->
                    <div id="drop-yard-node" class="relative hidden">
                        <div class="absolute -left-[31px] top-1 w-4 h-4 bg-white border-2 border-purple-500 rounded-full z-10 shadow-sm flex items-center justify-center"><i class="fa-solid fa-anchor text-[8px] text-purple-500"></i></div>
                        <div class="bg-purple-50 p-3 rounded-lg border border-purple-200 shadow-sm">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-purple-800 uppercase tracking-wide">2. ฝากลานพักตู้ (Drop Yard)</span>
                                <button onclick="removeDropYard()" class="text-red-400 hover:text-red-600 text-xs font-bold"><i class="fa-solid fa-trash-can"></i> ลบจุดพัก</button>
                            </div>
                            <input type="text" placeholder="ชื่อลานฝากตู้..." class="w-full px-2 py-1.5 border border-purple-300 rounded text-xs outline-none focus:border-purple-500 bg-white mb-2">
                            <div class="flex gap-2">
                                <input type="text" placeholder="ทะเบียนรถ (คันที่มารับช่วงต่อ)..." class="w-1/3 px-2 py-1.5 border border-purple-300 rounded text-xs outline-none focus:border-purple-500 bg-white">
                                <input type="text" placeholder="คนขับรถ (คันที่มารับช่วงต่อ)..." class="w-2/3 px-2 py-1.5 border border-purple-300 rounded text-xs outline-none focus:border-purple-500 bg-white">
                            </div>
                        </div>
                    </div>

                    <!-- จุดที่ 3: ปลายทาง -->
                    <div class="relative">
                        <div class="absolute -left-[31px] top-1 w-4 h-4 bg-white border-2 border-slate-400 rounded-full z-10 shadow-sm"></div>
                        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-wide">3. ปลายทาง (เข้าโรงงาน / คืนตู้)</span>
                        </div>
                    </div>
                </div>
                
                <div class="mt-6 flex justify-center">
                    <button id="btn-add-drop" onclick="addDropYard()" class="bg-white border-2 border-dashed border-purple-300 text-purple-600 hover:bg-purple-50 hover:border-purple-400 font-bold py-2 px-6 rounded-lg text-sm transition-colors flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-plus"></i> แทรกจุดฝากตู้
                    </button>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="bg-white px-5 py-3 border-t border-slate-200 flex justify-end gap-2">
                <button onclick="closeTimelineModal()" class="px-4 py-2 rounded-lg text-slate-600 bg-white border border-slate-300 text-sm font-bold hover:bg-slate-100">ยกเลิก</button>
                <button onclick="saveTimeline()" class="px-5 py-2 rounded-lg text-white bg-purple-600 text-sm font-bold hover:bg-purple-700 shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> บันทึกเส้นทาง
                </button>
            </div>
        </div>
    </div>

    <script src="js/modules/booking/manage.js"></script>
    <script>function logout() { localStorage.removeItem('tms_user'); window.location.href = '/login.html'; }</script>
</body>
</html>
