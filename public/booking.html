<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - ระบบจัดการบุคกิ้ง</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>
    
    <!-- Handsontable -->
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>

    <style>
        .export-theme { background: #fffdf5; border: 1px solid #ffeeba; }
        .import-theme { background: #f2f7ff; border: 1px solid #cce5ff; }
        .transfer-theme { background: #fdf5f5; border: 1px solid #ffccbc; }
        .handsontable th { font-weight: bold !important; font-size: 12px !important; background: #f8fafc; color: #334155; }
        .handsontable td { font-size: 13px !important; vertical-align: middle; }
    </style>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-truck-fast"></i></div>
            <span class="font-bold text-xl text-primary tracking-wide">TERN TMS <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold ml-1">BOOKING MANAGEMENT</span></span>
        </div>
        <div class="flex items-center gap-4">
            <a href="/booking-manage.html" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold text-sm flex items-center gap-2 px-4 py-2 rounded-lg transition-colors border border-emerald-200 shadow-sm">
                <i class="fa-solid fa-desktop"></i> ไปหน้าจัดการตู้
            </a>
            <a href="/index.html" class="text-slate-500 hover:text-primary font-medium text-sm flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg transition-colors border border-slate-200">
                <i class="fa-solid fa-arrow-left"></i> กลับหน้าแรก
            </a>
            <div class="text-right hidden sm:block">
                <div id="user-fullname" class="text-sm font-bold text-slate-700">กำลังโหลด...</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-2"><i class="fa-solid fa-power-off text-lg"></i></button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden justify-center relative">
        <main class="w-full max-w-7xl p-6 flex flex-col relative bg-bglight gap-4 h-full">
            
            <!-- 🌟 เมนูแท็บหลัก -->
            <div class="flex gap-2 shrink-0 bg-white p-1.5 rounded-xl border border-slate-200 w-fit shadow-sm">
                <button onclick="switchSubTab('form')" id="subtab-form" class="subtab-btn active bg-blue-50 text-primary font-semibold px-5 py-2.5 rounded-lg text-sm shadow-sm transition-all flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> 1. ฟอร์มรับงานใหม่ (New Booking)
                </button>
                <button onclick="switchSubTab('grid')" id="subtab-grid" class="subtab-btn text-slate-600 font-medium px-5 py-2.5 rounded-lg text-sm transition-all flex items-center gap-2 hover:text-primary hover:bg-slate-50">
                    <i class="fa-solid fa-table-list"></i> 2. ตารางรายการบุคกิ้ง (ดู/แก้ไข/ลบ)
                </button>
            </div>

            <!-- ============================================== -->
            <!-- TAB 1: FORM VIEW (หน้าฟอร์มสร้างรับงาน) -->
            <!-- ============================================== -->
            <div id="tab-content-form" class="flex-1 overflow-y-auto bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex-none">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-5">
                    <h2 class="text-xl font-bold text-primary flex items-center gap-2">
                        <i class="fa-solid fa-folder-plus"></i> <span id="form-title">สร้างรายการรับงานใหม่</span>
                    </h2>
                    <span id="editing-badge" class="hidden bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full border border-amber-300">
                        <i class="fa-solid fa-pen"></i> โหมดแก้ไข
                    </span>
                </div>
                
                <input type="hidden" id="editingOrderId" value="">

                <!-- STEP 1: ข้อมูลตั้งต้น -->
                <div class="bg-blue-50/50 p-5 rounded-xl border border-blue-100 mb-5 flex flex-wrap gap-5 items-end">
                    <div class="w-64">
                        <label class="block text-sm font-bold text-primary mb-1">🌐 เลือกลักษณะงาน (MODE)</label>
                        <select id="pMode" onchange="toggleModeUI()" class="w-full px-3 py-2 border border-blue-300 rounded-lg text-primary font-bold shadow-sm bg-white text-sm">
                            <option value="">-- เลือก Mode --</option>
                            <option value="EXPORT">🚢 EXPORT</option>
                            <option value="IMPORT">🛬 IMPORT</option>
                            <option value="TRANSFER">🚚 TRANSFER</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">📅 วันที่วิ่งงาน</label>
                        <input type="date" id="runDate" class="w-40 px-3 py-2 border border-slate-300 rounded-lg text-sm shadow-sm">
                    </div>
                    <div id="box-row-count">
                        <label class="block text-sm font-bold text-primary mb-1">จำนวนตู้</label>
                        <input type="number" id="rowCount" value="1" min="1" class="w-24 px-3 py-2 border border-blue-400 rounded-lg text-sm font-bold text-center bg-blue-50 text-primary">
                    </div>
                    <div class="flex-1 min-w-[250px]">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">🔍 ค้นหาชื่องาน</label>
                        <input type="text" id="jobNameInput" list="jobList" onchange="previewJobData()" onkeyup="previewJobData()" placeholder="พิมพ์ชื่องาน..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white shadow-sm">
                        <datalist id="jobList"></datalist>
                    </div>
                </div>

                <!-- STEP 2: ข้อมูลเฉพาะทาง และราคา -->
                <div id="jobPreviewBox" class="hidden animate-[fadeIn_0.3s_ease-out]">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm mb-5 relative">
                        <!-- โซน EXPORT / IMPORT ซ่อนไว้ -->
                        <div id="export-zone" class="export-theme p-4 rounded-xl mb-4 hidden">
                            <div class="font-bold text-amber-700 mb-3">ข้อมูลสำหรับงาน EXPORT</div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                                <div><label class="block text-slate-600 mb-1">BOOKING NO.</label><input type="text" id="pBookingExp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg"></div>
                                <div><label class="block text-slate-600 mb-1">AGENT</label><input type="text" id="pAgentExp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg"></div>
                            </div>
                        </div>

                        <div id="import-zone" class="import-theme p-4 rounded-xl mb-4 hidden">
                            <div class="font-bold text-blue-700 mb-3">ข้อมูลสำหรับงาน IMPORT</div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                                <div><label class="block text-slate-600 mb-1">BL NO.</label><input type="text" id="pBookingImp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg"></div>
                                <div><label class="block text-slate-600 mb-1">AGENT</label><input type="text" id="pAgentImp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg"></div>
                            </div>
                        </div>

                        <!-- 🔴 ช่องลูกค้า (customer_name) ที่คุณต้องการ 🔴 -->
                        <div class="grid grid-cols-2 md:grid-cols-7 gap-4 text-sm bg-slate-50 p-4 rounded-xl border border-slate-200 mt-4">
                            <div><label class="block text-slate-600 mb-1 font-bold">ลูกค้า (Customer)</label><input type="text" id="pCustomer" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white font-semibold" placeholder="ชื่อบริษัท"></div>
                            <div><label class="block text-slate-600 mb-1">ต้นทาง (Origin)</label><input type="text" id="pOrigin" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white"></div>
                            <div><label class="block text-slate-600 mb-1">ปลายทาง (Dest)</label><input type="text" id="pDest" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white"></div>
                            <div>
                                <label class="block text-slate-600 mb-1 font-bold text-primary">ประเภทรถ</label>
                                <select id="pPriceType" onchange="updateFeeDropdowns()" class="w-full px-3 py-1.5 border border-blue-300 rounded-lg bg-white shadow-sm font-semibold">
                                    <option value="">-- เลือก --</option>
                                    <option value="6W">6W</option>
                                    <option value="10W">10W</option>
                                    <option value="12W*2">12W*2</option>
                                </select>
                            </div>
                            <div><label class="block text-slate-600 mb-1">ค่าเที่ยว (คนขับ)</label><input type="number" id="pTripFee" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg font-bold text-green-700 bg-green-50"></div>
                            <div><label class="block text-slate-600 mb-1">ค่าขนส่ง (ลูกค้า)</label><input type="number" id="pTransFee" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg font-bold text-blue-700 bg-blue-50"></div>
                        </div>
                    </div>

                    <!-- 🌟 ปุ่มบันทึก (SAVE BUTTON) 🌟 -->
                    <div class="mt-5 flex items-center justify-between border-t border-slate-200 pt-5">
                        <p class="text-sm text-slate-500 font-medium"><i class="fa-solid fa-circle-info text-blue-500 mr-1"></i> ตรวจสอบชื่อลูกค้า และข้อมูลให้ครบถ้วนก่อนบันทึก</p>
                        <div class="flex gap-3">
                            <button onclick="cancelEdit()" id="btn-cancel-edit" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 px-6 rounded-lg border border-slate-300 shadow-sm">✖ ยกเลิก</button>
                            <!-- ปุ่มยิง API บันทึกลงตาราง Bookings -->
                            <button onclick="submitBookingForm(this)" id="btn-submit-form" class="bg-primary hover:bg-blue-900 text-white font-bold py-3 px-8 rounded-lg flex items-center gap-2 shadow-lg transition-all">
                                <i class="fa-solid fa-floppy-disk"></i> บันทึกบุคกิ้ง (Save)
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ============================================== -->
            <!-- TAB 2: GRID VIEW (หน้ารายการบุคกิ้งแบบ Excel) -->
            <!-- ============================================== -->
            <div id="tab-content-grid" class="hidden flex-1 flex flex-col overflow-hidden">
                <!-- แถบกรอง (Filter by Customer) -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4 shrink-0 mb-4">
                    <div class="flex items-center gap-3 flex-1 min-w-[300px]">
                        <label class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                            <i class="fa-solid fa-user-tag text-primary"></i> กรองลูกค้า (Customer Name):
                        </label>
                        <select id="filter-customer" onchange="filterByCustomerName()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm font-semibold outline-none focus:border-primary w-64 shadow-sm bg-slate-50">
                            <option value="">-- แสดงลูกค้าทั้งหมด --</option>
                        </select>
                        <button onclick="loadBookingGridData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-300 shadow-sm">
                            <i class="fa-solid fa-rotate-right"></i> โหลดข้อมูลใหม่
                        </button>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="deleteSelectedRows()" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 px-3 rounded-lg text-xs flex items-center gap-2 border border-red-200 shadow-sm">
                            <i class="fa-solid fa-trash-can"></i> ลบแถวที่เลือก
                        </button>
                        <button onclick="saveGridChanges()" id="btn-save-grid" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-5 rounded-lg shadow-md flex items-center gap-2 text-sm transition-transform">
                            <i class="fa-solid fa-floppy-disk"></i> บันทึกการแก้ไขในตาราง
                        </button>
                    </div>
                </div>

                <!-- ตาราง Handsontable -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 relative overflow-hidden min-h-[400px]">
                    <div id="booking-grid-container" class="absolute inset-0 z-0"></div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // ==========================================
        // ส่วนจัดการ TAB (ฟอร์ม vs ตาราง)
        // ==========================================
        function switchSubTab(tabName) {
            document.querySelectorAll('.subtab-btn').forEach(b => {
                b.classList.remove('bg-blue-50', 'text-primary', 'font-semibold', 'shadow-sm');
                b.classList.add('text-slate-600', 'font-medium');
            });
            const activeBtn = document.getElementById('subtab-' + tabName);
            activeBtn.classList.remove('text-slate-600', 'font-medium');
            activeBtn.classList.add('bg-blue-50', 'text-primary', 'font-semibold', 'shadow-sm');

            document.getElementById('tab-content-form').classList.add('hidden');
            document.getElementById('tab-content-grid').classList.add('hidden');
            document.getElementById('tab-content-' + tabName).classList.remove('hidden');

            if (tabName === 'grid') { loadBookingGridData(); }
        }

        function toggleModeUI() {
            const mode = document.getElementById('pMode').value;
            document.getElementById('export-zone').classList.add('hidden');
            document.getElementById('import-zone').classList.add('hidden');
            document.getElementById('jobPreviewBox').classList.remove('hidden');
            
            if(mode === 'EXPORT') document.getElementById('export-zone').classList.remove('hidden');
            else if(mode === 'IMPORT') document.getElementById('import-zone').classList.remove('hidden');
            else if(!mode) document.getElementById('jobPreviewBox').classList.add('hidden');
        }

        // ==========================================
        // 💾 1. ส่วนของฟอร์ม (บันทึกข้อมูล)
        // ==========================================
        async function submitBookingForm(btn) {
            const mode = document.getElementById('pMode').value;
            const runDate = document.getElementById('runDate').value;
            const customer = document.getElementById('pCustomer').value; // คอลัมน์สำคัญ
            const containerCount = document.getElementById('rowCount').value || 1;

            if(!mode || !runDate || !customer) {
                alert('⚠️ กรุณากรอก Mode, วันที่วิ่งงาน และชื่อลูกค้าให้ครบถ้วน'); 
                return; 
            }

            const dataToSave = {
                mode: mode,
                run_date: runDate,
                customer_name: customer,
                job_name: document.getElementById('jobNameInput').value,
                origin: document.getElementById('pOrigin').value,
                destination: document.getElementById('pDest').value,
                container_count: containerCount,
                booking_no: mode === 'EXPORT' ? document.getElementById('pBookingExp').value : document.getElementById('pBookingImp').value,
                trip_fee: document.getElementById('pTripFee').value,
                trans_fee: document.getElementById('pTransFee').value
            };

            const orgText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/bookings/header', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSave)
                });
                const result = await res.json();

                if (result.success) {
                    alert('✅ บันทึก Booking เรียบร้อย!');
                    window.location.reload(); // รีเฟรชเพื่อเคลียร์ฟอร์ม
                } else {
                    alert('❌ เกิดข้อผิดพลาด: ' + result.message);
                }
            } catch (err) {
                alert('❌ ติดต่อเซิร์ฟเวอร์ไม่ได้');
            } finally {
                btn.innerHTML = orgText;
                btn.disabled = false;
            }
        }

        // ==========================================
        // 📊 2. ส่วนของตาราง (ดึงจาก DB จริง)
        // ==========================================
        let hotGridInstance = null;
        let editedRowIndices = new Set(); 

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('tms_user');
            if (!savedUser) { window.location.href = '/login.html'; return; }
            document.getElementById('user-fullname').innerText = JSON.parse(savedUser).fullName;
        });

        async function loadBookingGridData() {
            try {
                // ดึงข้อมูลจริงจากตาราง bookings
                const res = await fetch('/api/bookings/search?start_date=2020-01-01&end_date=2030-12-31');
                const result = await res.json();

                if (result.success && result.data) {
                    populateCustomerDropdown(result.data); 
                    initBookingHandsontable(result.data);
                }
            } catch (err) { console.error(err); }
        }

        function populateCustomerDropdown(data) {
            const select = document.getElementById('filter-customer');
            select.innerHTML = '<option value="">-- แสดงลูกค้าทั้งหมด --</option>';

            const customers = new Set();
            data.forEach(item => {
                if (item.customer_name) customers.add(item.customer_name.trim());
            });

            Array.from(customers).sort().forEach(cust => {
                select.innerHTML += `<option value="${cust}">${cust}</option>`;
            });
        }

        function initBookingHandsontable(data) {
            const container = document.getElementById('booking-grid-container');
            if (hotGridInstance) { hotGridInstance.destroy(); }

            const formattedTableData = data.map(item => [
                false, 
                item.id,
                item.booking_no || '',
                item.mode || 'EXPORT',
                item.run_date ? item.run_date.split('T')[0] : '',
                item.customer_name || '', // คอลัมน์ที่ 5
                item.job_name || '',
                item.origin || '',
                item.destination || '',
                item.container_count || 1
            ]);

            hotGridInstance = new Handsontable(container, {
                data: formattedTableData,
                colHeaders: ['✔', 'ID', 'Booking No.', 'MODE', 'วันที่วิ่งงาน', 'ลูกค้า (customer_name)', 'ชื่องาน', 'ต้นทาง', 'ปลายทาง', 'จำนวนตู้'],
                columns: [
                    { type: 'checkbox', className: 'htCenter htMiddle' }, 
                    { readOnly: true, className: 'htCenter htMiddle text-slate-400 font-bold' }, 
                    { type: 'text', className: 'font-bold text-primary' }, 
                    { type: 'dropdown', source: ['EXPORT', 'IMPORT', 'TRANSFER'] }, 
                    { type: 'date', dateFormat: 'YYYY-MM-DD' }, 
                    { type: 'text', className: 'font-semibold text-slate-800' }, // customer_name
                    { type: 'text' }, { type: 'text' }, { type: 'text' }, { type: 'numeric' }
                ],
                rowHeaders: true, width: '100%', height: '100%', stretchH: 'all',
                manualColumnResize: true, manualColumnMove: true,
                filters: true, dropdownMenu: ['filter_by_condition', 'filter_by_value', 'filter_action_bar'],
                licenseKey: 'non-commercial-and-evaluation',

                // ดักจับแก้ไข
                afterChange: function(changes, source) {
                    if (source === 'loadData' || !changes) return;
                    changes.forEach(([row, prop, oldVal, newVal]) => {
                        if (oldVal !== newVal) editedRowIndices.add(row);
                    });
                }
            });
        }

        function filterByCustomerName() {
            if (!hotGridInstance) return;
            const selectedCustomer = document.getElementById('filter-customer').value;
            const plugin = hotGridInstance.getPlugin('filters');
            plugin.clearConditions();
            if (selectedCustomer) plugin.addCondition(5, 'eq', [selectedCustomer]); // Index 5
            plugin.filter();
        }

        async function saveGridChanges() {
            if (!hotGridInstance || editedRowIndices.size === 0) { alert('ไม่มีแก้ไข'); return; }

            const btn = document.getElementById('btn-save-grid');
            btn.innerHTML = 'กำลังบันทึก...'; btn.disabled = true;

            const data = hotGridInstance.getData();
            let successCount = 0;

            for (let rowIndex of editedRowIndices) {
                const row = data[rowIndex];
                if (!row[1]) continue; 

                const updateData = {
                    booking_no: row[2], mode: row[3], run_date: row[4],
                    customer_name: row[5], // อัปเดต customer_name
                    job_name: row[6], origin: row[7], destination: row[8], container_count: row[9]
                };

                try {
                    const res = await fetch(`/api/bookings/${row[1]}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updateData) });
                    if (res.ok) successCount++;
                } catch (err) {}
            }

            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> บันทึกการแก้ไข'; btn.disabled = false;
            if (successCount > 0) { alert(`✅ บันทึกสำเร็จ ${successCount} รายการ!`); editedRowIndices.clear(); loadBookingGridData(); }
        }

        async function deleteSelectedRows() {
            if (!hotGridInstance) return;
            const data = hotGridInstance.getData();
            const idsToDelete = [];

            data.forEach(row => { if (row[0] === true && row[1]) idsToDelete.push(row[1]); });
            if (idsToDelete.length === 0) return;
            if (!confirm(`⚠️ ยืนยันลบ ${idsToDelete.length} รายการ?`)) return;

            for (let id of idsToDelete) {
                try { await fetch(`/api/bookings/${id}`, { method: 'DELETE' }); } catch (err) {}
            }
            alert('✅ ลบสำเร็จ'); loadBookingGridData();
        }

        function logout() { localStorage.removeItem('tms_user'); window.location.href = '/login.html'; }
    </script>
</body>
</html>
