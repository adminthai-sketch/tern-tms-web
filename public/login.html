<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - เข้าสู่ระบบ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81' } } } }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans p-4 relative overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>

    <!-- Login Card -->
    <div class="bg-white p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] w-full max-w-md relative z-10 border border-slate-100">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg">
                <i class="fa-solid fa-truck-fast"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">TERN TMS</h1>
            <p class="text-slate-500 text-sm mt-1">ระบบบริหารจัดการงานขนส่ง</p>
        </div>

        <!-- Error Alert -->
        <div id="error-alert" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm mb-6 flex items-start gap-2">
            <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
            <span id="error-msg">ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง</span>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">ชื่อผู้ใช้งาน (Username)</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-3 text-slate-400"></i>
                    <input type="text" id="username" required autocomplete="username" class="w-full pl-11 pr-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors bg-slate-50 focus:bg-white text-sm" placeholder="กรอกชื่อผู้ใช้งาน">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3 text-slate-400"></i>
                    <input type="password" id="password" required autocomplete="current-password" class="w-full pl-11 pr-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors bg-slate-50 focus:bg-white text-sm" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-primary hover:bg-blue-900 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 mt-2">
                <span>เข้าสู่ระบบ</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>
        
        <div class="text-center mt-6">
            <p class="text-xs text-slate-400">© 2026 TERN TMS. All rights reserved.</p>
        </div>
    </div>

    <script>
        // ตรวจสอบว่าถ้าเคยล็อกอินไว้แล้ว ให้พาไปหน้าเมนูหลักเลย
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('tms_user')) {
                window.location.href = '/index.html';
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btn-login');
            const alertBox = document.getElementById('error-alert');
            const errorMsg = document.getElementById('error-msg');
            
            const usernameVal = document.getElementById('username').value.trim();
            const passwordVal = document.getElementById('password').value;

            // เปลี่ยนสถานะปุ่ม
            const originalBtnContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>กำลังตรวจสอบ...</span>';
            btn.disabled = true;
            alertBox.classList.add('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameVal, password: passwordVal })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // เก็บข้อมูลลง LocalStorage และเด้งไปหน้า Index (เมนูหลัก)
                    localStorage.setItem('tms_user', JSON.stringify(result.user));
                    window.location.href = '/index.html';
                } else {
                    // รหัสผิด หรือ Account โดนระงับ
                    errorMsg.innerText = result.message || 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง';
                    alertBox.classList.remove('hidden');
                    btn.innerHTML = originalBtnContent;
                    btn.disabled = false;
                }
            } catch (error) {
                errorMsg.innerText = 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้';
                alertBox.classList.remove('hidden');
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
