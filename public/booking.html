<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - สร้างบุคกิ้ง (Booking)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Handsontable สำหรับโหมด Bulk -->
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>
    <style>
        .export-theme { background: #fffdf5; border: 1px solid #ffeeba; }
        .import-theme { background: #f2f7ff; border: 1px solid #cce5ff; }
        .transfer-theme { background: #fdf5f5; border: 1px solid #ffccbc; }
        .tab-btn { transition: all 0.2s; }
        .tab-active { background-color: #0f4c81; color: white; border-color: #0f4c81; }
        .tab-inactive { background-color: white; color: #64748b; border-color: #cbd5e1; }
        /* สไตล์ตาราง Bulk */
        .handsontable th { font-weight: bold !important; font-size: 12px !important; background: #f8fafc; }
        .handsontable td { font-size: 13px !important; vertical-align: middle; }
        .ht-status-col { font-weight: bold; text-align: center; background-color: #f1f5f9 !important; }
        .status-success { color: #10b981; }
        .status-error { color: #ef4444; }
        .status-loading { color: #f59e0b; }
    </style>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-truck-fast"></i></div>
            <span class="font-bold text-xl text-primary tracking-wide">TERN TMS <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold ml-1">DATA ENTRY</span></span>
        </div>
        <div class="flex items-center gap-4">
            <a href="/booking-manage.html" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold text-sm flex items-center gap-2 px-4 py-2 rounded-lg transition-colors border border-emerald-200">
                <i class="fa-solid fa-desktop"></i> ไปหน้าจัดการตู้/จัดรถ
            </a>
            <a href="/index.html" class="text-slate-500 hover:text-primary font-medium text-sm flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg transition-colors border border-slate-200">
                <i class="fa-solid fa-arrow-left"></i> กลับหน้าแรก
            </a>
            <div class="text-right hidden sm:block">
                <div id="user-fullname" class="text-sm font-bold text-slate-700">กำลังโหลด...</div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden justify-center relative">
        <main class="w-full max-w-7xl p-6 overflow-y-auto flex flex-col relative bg-bglight gap-4">
            
            <!-- Tabs เปลี่ยนโหมดการทำงาน -->
            <div class="flex gap-3 mb-2">
                <button onclick="switchMode('single')" id="tab-single" class="tab-btn tab-active px-6 py-2.5 rounded-lg font-bold text-sm shadow-sm border flex items-center gap-2">
                    <i class="fa-solid fa-file-lines"></i> ฟอร์มคีย์เดี่ยว (Single Entry)
                </button>
                <button onclick="switchMode('bulk')" id="tab-bulk" class="tab-btn tab-inactive px-6 py-2.5 rounded-lg font-bold text-sm shadow-sm border flex items-center gap-2">
                    <i class="fa-solid fa-file-excel"></i> ก๊อปวางจาก Excel (Bulk Upload)
                </button>
            </div>

            <!-- ========================================== -->
            <!-- 📝 โหมดที่ 1: ฟอร์มคีย์เดี่ยว (ของเดิม) -->
            <!-- ========================================== -->
            <div id="section-single" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 block">
                <!-- โค้ดส่วนนี้คือฟอร์มเดิมของคุณทั้งหมด (ผมย่อไว้เพื่อให้โค้ดไม่ยาวเกินไป คุณสามารถเอาฟอร์มเดิมใน booking.html มาแปะทับใน div นี้ได้เลยครับ หรือใช้โค้ดพื้นฐานด้านล่าง) -->
                <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-5">
                    <h2 class="text-xl font-bold text-primary flex items-center gap-2"><i class="fa-solid fa-folder-plus"></i> สร้างรายการรับงานใหม่</h2>
                </div>
                
                <div class="bg-blue-50/50 p-5 rounded-xl border border-blue-100 mb-5">
                    <div class="flex flex-wrap gap-5 items-end">
                        <div class="w-64">
                            <label class="block text-sm font-bold text-primary mb-1">🌐 เลือกลักษณะงาน (MODE)</label>
                            <select id="pMode" class="w-full px-3 py-2 border border-blue-300 rounded-lg text-primary font-bold bg-white text-sm">
                                <option value="">-- กรุณาเลือก Mode --</option>
                                <option value="EXPORT">🚢 EXPORT (ขาออก)</option>
                                <option value="IMPORT">🛬 IMPORT (ขาเข้า)</option>
                                <option value="TRANSFER">🚚 TRANSFER (ขนถ่าย)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">📅 วันที่วิ่งงาน</label>
                            <input type="date" id="runDate" class="w-40 px-3 py-2 border border-slate-300 rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-primary mb-1">จำนวนตู้</label>
                            <input type="number" id="rowCount" value="1" min="1" class="w-24 px-3 py-2 border border-blue-400 rounded-lg text-sm font-bold text-center bg-blue-50">
                        </div>
                        <div class="flex-1 min-w-[250px]">
                            <label class="block text-sm font-semibold text-slate-700 mb-1">🔍 ค้นหาชื่องาน</label>
                            <input type="text" id="jobNameInput" placeholder="พิมพ์ชื่องาน..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-sm bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div><label class="block text-slate-600 mb-1">ลูกค้า</label><input type="text" id="pCustomer" class="w-full px-3 py-1.5 border rounded-lg bg-white"></div>
                    <div><label class="block text-slate-600 mb-1">Booking/BL No.</label><input type="text" id="pBookingNo" class="w-full px-3 py-1.5 border rounded-lg bg-white"></div>
                    <div><label class="block text-slate-600 mb-1">ต้นทาง</label><input type="text" id="pOrigin" class="w-full px-3 py-1.5 border rounded-lg bg-white"></div>
                    <div><label class="block text-slate-600 mb-1">ปลายทาง</label><input type="text" id="pDest" class="w-full px-3 py-1.5 border rounded-lg bg-white"></div>
                    <div><label class="block text-slate-600 mb-1">ประเภทรถ</label>
                        <select id="pPriceType" class="w-full px-3 py-1.5 border border-blue-300 rounded-lg bg-white font-semibold">
                            <option value="">-- เลือก --</option>
                            <option value="6W">6W</option>
                            <option value="10W">10W</option>
                            <option value="12W*2">12W*2</option>
                        </select>
                    </div>
                </div>
                
                <div class="mt-5 text-right border-t border-slate-200 pt-5">
                    <button onclick="saveSingleBooking()" class="bg-primary hover:bg-blue-900 text-white font-bold py-3 px-8 rounded-lg shadow-lg">
                        <i class="fa-solid fa-floppy-disk mr-2"></i> บันทึกข้อมูล
                    </button>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- 📋 โหมดที่ 2: อัปโหลดหลายรายการ (Bulk Excel) -->
            <!-- ========================================== -->
            <div id="section-bulk" class="bg-white rounded-xl shadow-sm border border-slate-200 p-0 hidden flex flex-col h-[700px]">
                
                <!-- Bulk Controls -->
                <div class="p-4 border-b border-slate-200 bg-slate-50 rounded-t-xl flex justify-between items-end shrink-0">
                    <div class="flex gap-4 items-end">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">เลือกโหมดงานก่อนนำเข้า</label>
                            <select id="bulk-mode" onchange="initBulkTable()" class="w-48 px-3 py-2 border border-slate-300 rounded-lg text-sm font-bold text-primary outline-none focus:border-blue-500">
                                <option value="EXPORT">🚢 EXPORT (ขาออก)</option>
                                <option value="IMPORT">🛬 IMPORT (ขาเข้า)</option>
                                <option value="TRANSFER">🚚 TRANSFER (ขนถ่าย)</option>
                            </select>
                        </div>
                        <button onclick="initBulkTable()" class="bg-white border border-slate-300 text-slate-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-100">
                            <i class="fa-solid fa-rotate mr-1"></i> รีเซ็ตตาราง
                        </button>
                    </div>
                    
                    <button onclick="processBulkSave()" id="btn-save-bulk" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-6 rounded-lg shadow-sm flex items-center gap-2 text-sm transition-colors">
                        <i class="fa-solid fa-cloud-arrow-up"></i> บันทึกข้อมูลเข้าระบบทีละแถว
                    </button>
                </div>

                <!-- Handsontable Container -->
                <div class="flex-1 relative w-full overflow-hidden">
                    <div id="hot-bulk-container" class="absolute inset-0"></div>
                </div>
                
                <div class="p-3 bg-blue-50 text-blue-700 text-xs font-bold border-t border-blue-100 rounded-b-xl flex items-center gap-2">
                    <i class="fa-solid fa-circle-info"></i> ก๊อปปี้ข้อมูลจากไฟล์ Excel มาวาง (Ctrl+V) ในตารางด้านบนได้เลย คอลัมน์ไหนไม่มีเว้นว่างไว้ได้
                </div>
            </div>

        </main>
    </div>

    <script>
        // --- ⚙️ จัดการ Tabs ---
        function switchMode(mode) {
            document.getElementById('section-single').classList.add('hidden');
            document.getElementById('section-bulk').classList.add('hidden');
            document.getElementById('tab-single').className = 'tab-btn tab-inactive px-6 py-2.5 rounded-lg font-bold text-sm shadow-sm border flex items-center gap-2';
            document.getElementById('tab-bulk').className = 'tab-btn tab-inactive px-6 py-2.5 rounded-lg font-bold text-sm shadow-sm border flex items-center gap-2';

            if (mode === 'single') {
                document.getElementById('section-single').classList.remove('hidden');
                document.getElementById('tab-single').className = 'tab-btn tab-active px-6 py-2.5 rounded-lg font-bold text-sm shadow-sm border flex items-center gap-2';
            } else {
                document.getElementById('section-bulk').classList.remove('hidden');
                document.getElementById('section-bulk').classList.add('flex');
                document.getElementById('tab-bulk').className = 'tab-btn tab-active px-6 py-2.5 rounded-lg font-bold text-sm shadow-sm border flex items-center gap-2';
                initBulkTable(); // สร้างตาราง Excel ทันทีที่เปิดแท็บ
            }
        }

        // ==========================================
        // 📋 โลจิกสำหรับโหมด Bulk (Excel Upload)
        // ==========================================
        let hotBulkInstance = null;

        // กำหนดหัวคอลัมน์มาตรฐานที่ต้องใช้รับงาน
        const BULK_HEADERS = [
            'สถานะเซฟ', 'วันที่วิ่งงาน (YYYY-MM-DD)', 'จำนวนตู้', 'ลูกค้า', 'ชื่องาน', 
            'ต้นทาง', 'ปลายทาง', 'Booking/BL/Ref No.', 'ประเภทรถ (6W/10W)', 'ค่าเที่ยว (บาท)', 'ค่าขนส่ง (บาท)'
        ];

        function initBulkTable() {
            const container = document.getElementById('hot-bulk-container');
            const mode = document.getElementById('bulk-mode').value;

            if (hotBulkInstance) {
                hotBulkInstance.destroy();
                hotBulkInstance = null;
            }

            // เตรียมแถวว่างๆ ไว้ 20 แถวให้ User ก๊อปวาง
            const emptyData = Array.from({ length: 20 }, () => new Array(BULK_HEADERS.length).fill(""));

            hotBulkInstance = new Handsontable(container, {
                data: emptyData,
                colHeaders: BULK_HEADERS,
                columns: [
                    { readOnly: true, className: 'ht-status-col' }, // [0] สถานะ
                    { type: 'date', dateFormat: 'YYYY-MM-DD' },     // [1] วันที่
                    { type: 'numeric' },                            // [2] จำนวนตู้
                    { type: 'text' },                               // [3] ลูกค้า
                    { type: 'text' },                               // [4] ชื่องาน
                    { type: 'text' },                               // [5] ต้นทาง
                    { type: 'text' },                               // [6] ปลายทาง
                    { type: 'text', className: 'font-bold uppercase' }, // [7] Booking No
                    { type: 'dropdown', source: ['6W', '10W', '12W*2', 'เงินสด'] }, // [8] รถ
                    { type: 'numeric' },                            // [9] ค่าเที่ยว
                    { type: 'numeric' }                             // [10] ค่าขนส่ง
                ],
                rowHeaders: true,
                width: '100%',
                height: '100%',
                stretchH: 'all',
                minSpareRows: 5,
                contextMenu: true,
                licenseKey: 'non-commercial-and-evaluation'
            });
        }

        // 🚀 ฟังก์ชันกวาดข้อมูลทีละบรรทัดไปยิง API
        async function processBulkSave() {
            if (!hotBulkInstance) return;

            const mode = document.getElementById('bulk-mode').value;
            const btn = document.getElementById('btn-save-bulk');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังอัปโหลดทีละรายการ...';
            btn.disabled = true;

            const tableData = hotBulkInstance.getData();
            let successCount = 0;

            for (let i = 0; i < tableData.length; i++) {
                const row = tableData[i];
                
                // ข้ามแถวที่ไม่มีวันที่วิ่งงาน หรือ ไม่มีจำนวนตู้
                if (!row[1] || !row[2]) continue;

                // อัปเดต UI ว่ากำลังทำแถวนี้
                hotBulkInstance.setDataAtCell(i, 0, '⏳ กำลังบันทึก...');

                // เตรียมข้อมูลส่งเข้า API หัวบิล (เหมือนหน้า Single)
                const bookingData = {
                    mode: mode,
                    run_date: row[1],
                    container_count: row[2],
                    customer_name: row[3] || '',
                    job_name: row[4] || '',
                    origin: row[5] || '',
                    destination: row[6] || '',
                    booking_no: row[7] || `TEMP-${Date.now().toString().slice(-5)}`,
                    price_type: row[8] || '',
                    trip_fee: row[9] || 0,
                    trans_fee: row[10] || 0
                };

                try {
                    // 1. เซฟหัวบิล
                    const resHeader = await fetch('/api/bookings/header', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bookingData)
                    });
                    const resultHeader = await resHeader.json();

                    if (resultHeader.success) {
                        // 2. เซฟหางบิล (สร้างตู้เปล่าตามจำนวน)
                        let shipmentsData = [];
                        const today = new Date().toISOString().split('T')[0];
                        const datePrefix = bookingData.run_date.replace(/-/g, '').substring(2); 

                        for (let c = 0; c < bookingData.container_count; c++) {
                            let orderId = `ORD-${datePrefix}-${Math.floor(1000 + Math.random() * 9000)}-${c+1}`;
                            let sRow = new Array(79).fill(""); 
                            sRow[0] = false; sRow[1] = orderId; sRow[2] = mode; sRow[3] = today; sRow[4] = bookingData.run_date;
                            sRow[5] = bookingData.job_name; sRow[6] = bookingData.customer_name; sRow[7] = bookingData.booking_no;
                            sRow[10] = 1; sRow[56] = bookingData.trip_fee; sRow[57] = bookingData.trans_fee; sRow[78] = 'รอจัดรถ';
                            shipmentsData.push(sRow);
                        }

                        const resShipments = await fetch('/api/shipments', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: shipmentsData })
                        });
                        const resultShipments = await resShipments.json();

                        if (resultShipments.success) {
                            hotBulkInstance.setDataAtCell(i, 0, '✅ สำเร็จ');
                            successCount++;
                        } else {
                            hotBulkInstance.setDataAtCell(i, 0, '❌ พลาด (หางบิล)');
                        }
                    } else {
                        hotBulkInstance.setDataAtCell(i, 0, `❌ พลาด (${resultHeader.message})`);
                    }
                } catch (err) {
                    hotBulkInstance.setDataAtCell(i, 0, '❌ Error API');
                }
            }

            btn.innerHTML = originalText;
            btn.disabled = false;
            
            if (successCount > 0) {
                alert(`🎉 นำเข้าข้อมูลสำเร็จจำนวน ${successCount} รายการ!`);
            } else {
                alert(`⚠️ ไม่พบข้อมูลที่สมบูรณ์สำหรับนำเข้า (กรุณาระบุ วันที่ และ จำนวนตู้)`);
            }
        }

        // ==========================================
        // จำลองฟังก์ชันบันทึกฟอร์มเดี่ยว (ใส่โค้ดจริงของคุณใน form.js มาเรียกตรงนี้ได้)
        // ==========================================
        function saveSingleBooking() {
            alert('ส่วนนี้จะเรียกฟังก์ชัน generateData() ของฟอร์มเดิมครับ');
        }
    </script>
</body>
</html>
