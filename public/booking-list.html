<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - รายการบุคกิ้ง (Booking List)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>

    <!-- Handsontable (Excel Grid) -->
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>

    <style>
        .handsontable th { font-weight: bold !important; font-size: 12px !important; background: #f8fafc; color: #334155; }
        .handsontable td { font-size: 13px !important; vertical-align: middle; }
    </style>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-list-check"></i></div>
            <span class="font-bold text-xl text-primary tracking-wide">TERN TMS <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold ml-1">BOOKING LIST</span></span>
        </div>
        <div class="flex items-center gap-4">
            <a href="/booking.html" class="bg-primary hover:bg-blue-900 text-white font-bold text-sm flex items-center gap-2 px-4 py-2 rounded-lg transition-colors shadow-sm">
                <i class="fa-solid fa-plus"></i> กลับไปหน้าสร้างงาน
            </a>
            <a href="/index.html" class="text-slate-500 hover:text-primary font-medium text-sm flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg transition-colors border border-slate-200">
                <i class="fa-solid fa-arrow-left"></i> กลับหน้าแรก
            </a>
            <div class="text-right hidden sm:block">
                <div id="user-fullname" class="text-sm font-bold text-slate-700">กำลังโหลด...</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-2"><i class="fa-solid fa-power-off text-lg"></i></button>
        </div>
    </header>

    <main class="flex-1 p-6 overflow-hidden flex flex-col gap-4">
        
        <!-- 🔍 แถบเครื่องมือ & ตัวกรอง Customer_name -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4 shrink-0">
            <div class="flex items-center gap-3 flex-1 min-w-[300px]">
                <label class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-user-tag text-primary"></i> กรองลูกค้า (customer_name):
                </label>
                <select id="filter-customer" onchange="filterByCustomerName()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm font-semibold outline-none focus:border-primary w-64 shadow-sm bg-slate-50">
                    <option value="">-- แสดงลูกค้าทั้งหมด --</option>
                </select>
                <button onclick="loadBookingGridData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-300 transition-colors shadow-sm">
                    <i class="fa-solid fa-rotate-right"></i> รีเฟรชข้อมูล
                </button>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="deleteSelectedRows()" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 px-3 rounded-lg text-xs flex items-center gap-2 border border-red-200 shadow-sm">
                    <i class="fa-solid fa-trash-can"></i> ลบแถวที่เลือก
                </button>
                <button onclick="saveGridChanges()" id="btn-save-grid" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-5 rounded-lg shadow-md flex items-center gap-2 text-sm transition-transform hover:-translate-y-0.5">
                    <i class="fa-solid fa-floppy-disk"></i> บันทึกการแก้ไขในตาราง
                </button>
            </div>
        </div>

        <!-- 📋 ตาราง (Handsontable) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 relative overflow-hidden">
            <div id="booking-grid-container" class="absolute inset-0 z-0"></div>
        </div>

    </main>

    <!-- สคริปต์ควบคุมตาราง -->
    <script src="js/modules/booking/list.js"></script>

</body>
</html>
