<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - Admin Backoffice</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .ht-row-selected { background-color: #e0f2fe !important; transition: 0.2s; }
        .handsontable th { font-weight: bold !important; }
    </style>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col">

    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-emerald-600 text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-shield-halved"></i></div>
            <span class="font-bold text-xl text-slate-800 tracking-wide">TERN TMS <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold ml-1">ADMIN</span></span>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="text-right hidden sm:block">
                <div id="user-fullname" class="text-sm font-bold text-slate-700">Admin</div>
                <div id="user-role-badge" class="inline-block px-2 py-0.5 mt-0.5 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-700">ADMIN</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-2" title="ออกจากระบบ"><i class="fa-solid fa-power-off text-lg"></i></button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        
        <!-- SIDEBAR (มีระบบซ่อนเมนูตามสิทธิ์) -->
        <nav class="w-64 bg-white border-r border-slate-200 flex flex-col py-6 shrink-0 overflow-y-auto z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
            <div class="px-6 mb-3 text-xs font-bold text-slate-400 uppercase tracking-wider">Main Applications</div>
            
            <a href="/monitor.html" id="menu-monitor" class="sidebar-item hidden items-center gap-3 px-6 py-3 text-slate-600 hover:bg-blue-50 hover:text-primary transition-colors"><i class="fa-solid fa-desktop w-5 text-center"></i> 1. มอนิเตอร์งาน</a>
            <a href="/booking.html" id="menu-booking" class="sidebar-item hidden items-center gap-3 px-6 py-3 text-slate-600 hover:bg-blue-50 hover:text-primary transition-colors"><i class="fa-solid fa-file-signature w-5 text-center"></i> 2. สร้างบุคกิ้ง</a>
            <a href="/dispatch.html" id="menu-dispatch" class="sidebar-item hidden items-center gap-3 px-6 py-3 text-slate-600 hover:bg-blue-50 hover:text-primary transition-colors"><i class="fa-solid fa-truck-ramp-box w-5 text-center"></i> 3. จัดคนขับ</a>
            <a href="/billing.html" id="menu-billing" class="sidebar-item hidden items-center gap-3 px-6 py-3 text-slate-600 hover:bg-blue-50 hover:text-primary transition-colors"><i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> 4. วางบิล</a>

            <div id="menu-admin" class="hidden">
                <div class="px-6 mt-8 mb-2 text-xs font-bold text-emerald-600 uppercase tracking-wider flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> 5. Admin Only</div>
                <a href="/admin/admin.html" class="sidebar-item active flex items-center gap-3 px-6 py-3 bg-emerald-50 text-emerald-700 border-r-4 border-emerald-600 font-semibold"><i class="fa-solid fa-database w-5 text-center"></i> จัดการข้อมูลหลังบ้าน</a>
            </div>
        </nav>

        <main class="flex-1 p-6 overflow-hidden flex flex-col relative bg-bglight">
            
            <div class="flex gap-2 mb-4 bg-white p-1.5 rounded-xl border border-slate-200 w-fit shadow-sm overflow-x-auto">
                <button onclick="switchMasterTab('users')" id="tab-master-users" class="master-tab-btn active bg-emerald-50 text-emerald-700 font-semibold px-4 py-2 rounded-lg text-sm shadow-sm transition-all flex items-center gap-2"><i class="fa-solid fa-users"></i> ผู้ใช้งาน</button>
                <button onclick="switchMasterTab('roles')" id="tab-master-roles" class="master-tab-btn text-slate-600 font-medium px-4 py-2 rounded-lg text-sm transition-all flex items-center gap-2 hover:text-slate-900 hover:bg-slate-50"><i class="fa-solid fa-user-shield text-purple-600"></i> สิทธิ์เข้าถึง (Roles)</button>
                <button onclick="switchMasterTab('drivers')" id="tab-master-drivers" class="master-tab-btn text-slate-600 font-medium px-4 py-2 rounded-lg text-sm transition-all flex items-center gap-2 hover:text-slate-900 hover:bg-slate-50"><i class="fa-solid fa-id-card text-blue-600"></i> คนขับ/รถ</button>
                <button onclick="switchMasterTab('customers')" id="tab-master-customers" class="master-tab-btn text-slate-600 font-medium px-4 py-2 rounded-lg text-sm transition-all flex items-center gap-2 hover:text-slate-900 hover:bg-slate-50"><i class="fa-solid fa-building text-amber-600"></i> ข้อมูลลูกค้า</button>
                <button onclick="switchMasterTab('rates')" id="tab-master-rates" class="master-tab-btn text-slate-600 font-medium px-4 py-2 rounded-lg text-sm transition-all flex items-center gap-2 hover:text-slate-900 hover:bg-slate-50"><i class="fa-solid fa-hand-holding-dollar text-indigo-600"></i> เรทราคา</button>
            </div>

            <div class="h-full flex flex-col bg-white rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center p-5 border-b border-slate-100">
                    <div>
                        <h2 id="table-title" class="text-xl font-bold text-emerald-600 flex items-center gap-2"><i class="fa-solid fa-users"></i> จัดการผู้ใช้งานระบบ</h2>
                        <p class="text-xs text-slate-400 mt-1">ใช้ตัวกรองบนหัวคอลัมน์เพื่อค้นหา หรือดับเบิ้ลคลิกในตารางเพื่อแก้ไข</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openColToggleModal()" class="bg-white hover:bg-slate-50 text-slate-600 font-bold py-2 px-4 rounded-lg flex items-center gap-2 text-sm transition-colors border border-slate-200 shadow-sm"><i class="fa-solid fa-eye"></i> ซ่อนคอลัมน์</button>
                        <button onclick="saveCurrentMaster()" id="btn-save-master" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg flex items-center gap-2 text-sm shadow-sm transition-colors"><i class="fa-solid fa-floppy-disk"></i> บันทึกตาราง</button>
                    </div>
                </div>

                <div class="flex justify-between items-center bg-slate-50 px-5 py-3 border-b border-slate-200">
                    <div class="text-sm font-semibold text-slate-500"><i class="fa-solid fa-check-square text-primary mr-1"></i> ติ๊กเลือกรายการด้านซ้ายเพื่อลบ</div>
                    <div class="flex gap-2">
                        <!-- ปุ่ม Add Modal เดิมยังอยู่ -->
                        <button onclick="openAddModal()" class="bg-blue-600 text-white hover:bg-blue-700 font-bold py-2 px-4 rounded-lg flex items-center gap-2 text-sm transition-colors shadow-sm"><i class="fa-solid fa-plus"></i> เพิ่มข้อมูล (Popup)</button>
                        <!-- เพิ่มปุ่มลบที่เลือก -->
                        <button onclick="deleteCheckedRows()" class="bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 font-bold py-2 px-4 rounded-lg flex items-center gap-2 text-sm transition-colors shadow-sm"><i class="fa-solid fa-trash-can"></i> ลบที่ติ๊กเลือก</button>
                    </div>
                </div>

                <div class="flex-1 relative w-full overflow-hidden bg-white"><div id="hot-master-container" class="w-full h-full z-0 relative"></div></div>
            </div>
        </main>
    </div>

    <!-- POPUP MODAL: เพิ่มข้อมูล (ADD FORM) -->
    <div id="add-modal" class="hidden absolute inset-0 z-[60] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-primary text-white">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-plus-circle mr-2"></i> เพิ่มข้อมูลใหม่</h3>
                <button onclick="closeAddModal()" class="hover:text-red-300"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[60vh]">
                <form id="add-form-inputs" class="space-y-4"></form>
            </div>
            <div class="p-5 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
                <button onclick="closeAddModal()" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50">ยกเลิก</button>
                <button onclick="submitAddForm()" class="px-4 py-2 bg-primary hover:bg-blue-900 text-white rounded-lg text-sm font-bold shadow-sm">➕ ยืนยันการเพิ่มลงตาราง</button>
            </div>
        </div>
    </div>

    <!-- Modal ซ่อน/แสดงคอลัมน์ -->
    <div id="col-toggle-modal" class="hidden absolute inset-0 z-[60] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 text-lg"><i class="fa-solid fa-eye mr-2 text-emerald-600"></i> ซ่อน/แสดงคอลัมน์</h3>
                <button onclick="closeColToggleModal()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="col-toggle-container" class="p-6 grid grid-cols-2 gap-3 max-h-[60vh] overflow-y-auto bg-white"></div>
        </div>
    </div>

    <script>
        // --- 🔒 Guard & Sidebar Menu Visibility ---
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('tms_user');
            if (!savedUser) { window.location.href = '/login.html'; return; }
            
            const user = JSON.parse(savedUser);
            document.getElementById('user-fullname').innerText = user.fullName;
            document.getElementById('user-role-badge').innerText = user.role.toUpperCase();

            // เช็คสิทธิ์และแสดงเมนู Sidebar (ถ้าเป็น Admin หรือมีสิทธิ์)
            const p = user.permissions || {};
            if (p.admin || user.role === 'Admin') {
                document.getElementById('menu-admin').classList.remove('hidden');
            } else { 
                alert('⛔ คุณไม่มีสิทธิ์เข้าถึงหน้า Admin'); window.location.href = '/index.html'; return; 
            }

            if (p.monitor || user.role === 'Admin') { document.getElementById('menu-monitor').classList.remove('hidden'); document.getElementById('menu-monitor').style.display = 'flex'; }
            if (p.booking || user.role === 'Admin') { document.getElementById('menu-booking').classList.remove('hidden'); document.getElementById('menu-booking').style.display = 'flex'; }
            if (p.dispatch || user.role === 'Admin') { document.getElementById('menu-dispatch').classList.remove('hidden'); document.getElementById('menu-dispatch').style.display = 'flex'; }
            if (p.billing || user.role === 'Admin') { document.getElementById('menu-billing').classList.remove('hidden'); document.getElementById('menu-billing').style.display = 'flex'; }

            switchMasterTab('users');
        });

        function logout() { localStorage.removeItem('tms_user'); window.location.href = '/login.html'; }

        // --- 📊 ตาราง Master Data ---
        let currentMasterType = 'users';
        let hotMasterInstance = null;
        let roleDropdownList = ['Admin', 'User']; // รออัปเดตจาก API

        const masterConfigs = {
            users: {
                title: 'จัดการผู้ใช้งานระบบ (Users)', icon: 'fa-users', endpoint: '/api/users',
                headers: ['ID', 'Username', 'ชื่อ-นามสกุล', 'อีเมล (รับ OTP)', 'กลุ่มสิทธิ์ (Role)', 'สถานะ (Status)'],
                columns: [{ readOnly: true }, { type: 'text' }, { type: 'text' }, { type: 'text' }, { type: 'dropdown', source: roleDropdownList }, { type: 'dropdown', source: ['ACTIVE', 'INACTIVE'] }]
            },
            roles: {
                title: 'จัดการกลุ่มสิทธิ์ (Roles & Permissions)', icon: 'fa-user-shield', endpoint: '/api/roles',
                headers: ['ID', 'ชื่อกลุ่มสิทธิ์', '💻 เข้ามอนิเตอร์', '📦 สร้างบุคกิ้ง', '🚛 จัดคนขับ', '📄 วางบิล', '⚙️ เข้าหน้าแอดมิน'],
                columns: [{ readOnly: true }, { type: 'text' }, { type: 'checkbox', className: 'htCenter htMiddle' }, { type: 'checkbox', className: 'htCenter htMiddle' }, { type: 'checkbox', className: 'htCenter htMiddle' }, { type: 'checkbox', className: 'htCenter htMiddle' }, { type: 'checkbox', className: 'htCenter htMiddle' }]
            },
            drivers: {
                title: 'จัดการคนขับและรถ (Drivers)', icon: 'fa-id-card', endpoint: '/api/drivers',
                headers: ['ป้ายทะเบียน', 'ประเภทรถ', 'ชื่อ.พนง.', 'ชื่อเล่น'],
                columns: [{ type: 'text' }, { type: 'text' }, { type: 'text' }, { type: 'text' }]
            },
            customers: {
                title: 'จัดการข้อมูลลูกค้า (Customers)', icon: 'fa-building', endpoint: '/api/customers',
                headers: ['Customer No.', 'Customer Name', 'ชื่อลูกค้าย่อ', 'Billing Name', 'Phone Number', 'Address', 'Tax ID'],
                columns: Array(7).fill({ type: 'text' })
            },
            rates: {
                title: 'จัดการเรทราคาค่าเที่ยว (Rates)', icon: 'fa-hand-holding-dollar', endpoint: '/api/rates',
                headers: ["ชื่องาน", "ลูกค้า", "ต้นทาง", "ปลายทาง", "วิ่งงาน", "จำนวนตู้/ใบ", "ประเภทงาน", "ค่าเที่ยว 6W", "ค่าเที่ยว 10W", "ค่าเที่ยว 12W*2", "ค่าเที่ยวเงินสด", "ค่าขนส่ง 6W", "ค่าขนส่ง 10W", "ค่าขนส่ง 12W*2", "งานเงินสด"],
                columns: Array(15).fill({ type: 'text' })
            }
        };

        function getUIState(tableName) { const user = JSON.parse(localStorage.getItem('tms_user')); return JSON.parse(localStorage.getItem(`tms_ui_${tableName}_${user.username}`)) || {}; }
        function saveUIState(tableName, stateData) { const user = JSON.parse(localStorage.getItem('tms_user')); const existing = getUIState(tableName); localStorage.setItem(`tms_ui_${tableName}_${user.username}`, JSON.stringify({ ...existing, ...stateData })); }

        async function switchMasterTab(type) {
            currentMasterType = type;
            const cfg = masterConfigs[type];
            document.getElementById('table-title').innerHTML = `<i class="fa-solid ${cfg.icon}"></i> ${cfg.title}`;

            document.querySelectorAll('.master-tab-btn').forEach(b => { b.classList.remove('bg-emerald-50', 'text-emerald-700', 'font-semibold', 'shadow-sm'); b.classList.add('text-slate-600', 'font-medium'); });
            const activeTab = document.getElementById('tab-master-' + type);
            activeTab.classList.remove('text-slate-600', 'font-medium'); activeTab.classList.add('bg-emerald-50', 'text-emerald-700', 'font-semibold', 'shadow-sm');

            try {
                const response = await fetch(cfg.endpoint);
                const result = await response.json();
                
                // อัปเดต Dropdown รายชื่อ Role ถ้าดึงหน้า User
                if (type === 'users' && result.roleList) {
                    roleDropdownList = result.roleList;
                    cfg.columns[4].source = roleDropdownList;
                }

                const container = document.getElementById('hot-master-container');
                if (hotMasterInstance) hotMasterInstance.destroy();

                let safeData = (result.data && result.data.length > 0) ? result.data : [new Array(cfg.headers.length).fill("")];
                safeData = safeData.map(row => [false, ...row]); // ยัด Checkbox ไว้คอลัมน์ 0

                const uiState = getUIState('master_' + type);

                hotMasterInstance = new Handsontable(container, {
                    data: safeData, 
                    colHeaders: ['✔ ลบ', ...cfg.headers], 
                    columns: [{ type: 'checkbox', className: 'htCenter htMiddle' }, ...cfg.columns],
                    rowHeaders: true, minSpareRows: 0, width: '100%', height: '100%', manualColumnResize: true, manualColumnMove: true, filters: true, 
                    dropdownMenu: ['filter_by_condition', 'filter_by_value', 'filter_action_bar', '---------', 'clear_column'],
                    hiddenColumns: { columns: uiState.hiddenColumns || [], indicators: true },
                    colWidths: uiState.colWidths || undefined,
                    stretchH: type === 'rates' ? 'all' : 'none',
                    licenseKey: 'non-commercial-and-evaluation',
                    cells: function(row, col) { let cp = {}; if (this.instance && this.instance.getDataAtCell(row, 0) === true) cp.className = (cp.className || '') + ' ht-row-selected'; return cp; },
                    afterChange: function(changes, source) { if (source !== 'loadData' && changes) { if (changes.some(c => c[1] === 0)) this.render(); } },
                    afterColumnResize: function() { saveUIState('master_' + currentMasterType, { colWidths: this.getPlugin('manualColumnResize').manualColumnWidths }); }
                });
            } catch (err) { alert('❌ โหลดข้อมูลไม่สำเร็จ: ' + err.message); }
        }

        // --- 📝 POPUP เพิ่มข้อมูล (ADD MODAL) ---
        function openAddModal() {
            const cfg = masterConfigs[currentMasterType];
            let html = '';
            
            cfg.headers.forEach((h, index) => {
                let colCfg = cfg.columns[index];
                if (colCfg.readOnly) return;
                
                html += `<div><label class="block text-sm font-semibold text-slate-700 mb-1">${h}</label>`;
                
                if (colCfg.type === 'dropdown') {
                    let opts = colCfg.source.map(o => `<option value="${o}">${o}</option>`).join('');
                    html += `<select id="add-input-${index}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-sm"><option value="">-- เลือก --</option>${opts}</select>`;
                } else if (colCfg.type === 'checkbox') {
                    html += `<input type="checkbox" id="add-input-${index}" class="w-5 h-5 accent-primary rounded">`;
                } else {
                    html += `<input type="text" id="add-input-${index}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-sm" placeholder="ระบุ ${h}...">`;
                }
                html += `</div>`;
            });

            document.getElementById('add-form-inputs').innerHTML = html;
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

        function submitAddForm() {
            const cfg = masterConfigs[currentMasterType];
            let newRow = [false];
            
            cfg.headers.forEach((h, index) => {
                if (cfg.columns[index].readOnly) {
                    newRow.push('');
                } else if (cfg.columns[index].type === 'checkbox') {
                    newRow.push(document.getElementById(`add-input-${index}`).checked);
                } else {
                    newRow.push(document.getElementById(`add-input-${index}`).value);
                }
            });

            hotMasterInstance.alter('insert_row_above', 0);
            hotMasterInstance.populateFromArray(0, 0, [newRow]);
            closeAddModal();
        }

        function deleteCheckedRows() {
            if (!hotMasterInstance) return;
            const data = hotMasterInstance.getData();
            let rowsToDelete = [];
            for (let i = 0; i < data.length; i++) { if (data[i][0] === true) rowsToDelete.push(i); }
            if (rowsToDelete.length === 0) return alert('🖱️ กรุณาติ๊กช่องซ้ายสุดของแถวที่ต้องการลบก่อนครับ');
            if (confirm(`⚠️ ยืนยันการลบ ${rowsToDelete.length} รายการ? (กด "บันทึก" เพื่อยืนยันอีกครั้ง)`)) {
                rowsToDelete.sort((a, b) => b - a).forEach(rowIndex => hotMasterInstance.alter('remove_row', rowIndex));
            }
        }

        async function saveCurrentMaster() {
            if (!hotMasterInstance) return;
            const btn = document.getElementById('btn-save-master');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...'; btn.disabled = true;

            const cfg = masterConfigs[currentMasterType];
            const cleanData = hotMasterInstance.getData().map(row => row.slice(1)).filter(r => r.some(c => c !== null && c !== ''));

            try {
                const response = await fetch(cfg.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: cleanData }) });
                const result = await response.json();
                if (result.success) { alert('✅ ' + result.message); switchMasterTab(currentMasterType); } 
                else { alert('❌ เกิดข้อผิดพลาด: ' + result.message); }
            } catch (err) { alert('❌ บันทึกข้อมูลไม่สำเร็จ: ' + err.message); } 
            finally { btn.innerHTML = originalText; btn.disabled = false; }
        }

        // --- 🎛️ Modal ซ่อนคอลัมน์ ---
        function openColToggleModal() {
            const plugin = hotMasterInstance.getPlugin('hiddenColumns');
            const hiddenCols = plugin.getHiddenColumns() || [];
            let html = '';
            masterConfigs[currentMasterType].headers.forEach((header, index) => {
                const actualIndex = index + 1;
                const isChecked = !hiddenCols.includes(actualIndex) ? 'checked' : '';
                html += `<label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 hover:bg-emerald-50 cursor-pointer transition-colors"><input type="checkbox" class="w-5 h-5 accent-emerald-600 rounded" ${isChecked} onchange="toggleMasterColumn(${actualIndex}, this.checked)"><span class="font-medium text-slate-700 text-sm">${header}</span></label>`;
            });
            document.getElementById('col-toggle-container').innerHTML = html;
            document.getElementById('col-toggle-modal').classList.remove('hidden');
        }
        function closeColToggleModal() { document.getElementById('col-toggle-modal').classList.add('hidden'); }
        function toggleMasterColumn(colIndex, isVisible) {
            const plugin = hotMasterInstance.getPlugin('hiddenColumns');
            if (isVisible) plugin.showColumns([colIndex]); else plugin.hideColumns([colIndex]);
            hotMasterInstance.render();
            saveUIState('master_' + currentMasterType, { hiddenColumns: plugin.getHiddenColumns() || [] });
        }
    </script>
</body>
</html>
