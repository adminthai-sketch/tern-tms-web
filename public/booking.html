<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS - สร้างบุคกิ้ง (Booking)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>

    <!-- Handsontable สำหรับตาราง Excel -->
    <link href="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.1.2/dist/handsontable.full.min.js"></script>

    <style>
        .export-theme { background: #fffdf5; border: 1px solid #ffeeba; }
        .import-theme { background: #f2f7ff; border: 1px solid #cce5ff; }
        .transfer-theme { background: #fdf5f5; border: 1px solid #ffccbc; }
        /* สไตล์สำหรับ Tabs */
        .tab-btn { transition: all 0.2s; }
        .tab-active { background-color: #0f4c81; color: white; border-color: #0f4c81; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .tab-inactive { background-color: white; color: #64748b; border-color: #cbd5e1; }
        .tab-inactive:hover { background-color: #f1f5f9; }
        /* สไตล์ตาราง */
        .handsontable th { font-weight: bold !important; font-size: 12px !important; background: #f8fafc; }
        .handsontable td { font-size: 13px !important; vertical-align: middle; }
        .ht-status-col { font-weight: bold; text-align: center; background-color: #f1f5f9 !important; }
    </style>
</head>
<body class="bg-bglight text-slate-800 h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-truck-fast"></i></div>
            <span class="font-bold text-xl text-primary tracking-wide">TERN TMS <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold ml-1">DATA ENTRY</span></span>
        </div>
        <div class="flex items-center gap-4">
            <a href="/booking-manage.html" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold text-sm flex items-center gap-2 px-4 py-2 rounded-lg transition-colors border border-emerald-200 shadow-sm">
                <i class="fa-solid fa-desktop"></i> ไปหน้าจัดรถ (Dispatch)
            </a>
            <button onclick="window.location.href='/index.html'" class="text-slate-500 hover:text-primary font-medium text-sm flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg transition-colors border border-slate-200">
                <i class="fa-solid fa-arrow-left"></i> กลับหน้าแรก
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden justify-center relative">
        <main class="w-full max-w-7xl p-6 overflow-y-auto flex flex-col relative bg-bglight gap-4">
            
            <!-- 🌟 Tabs เปลี่ยนโหมดการทำงาน -->
            <div class="flex gap-3 shrink-0">
                <button onclick="switchMode('single')" id="tab-single" class="tab-btn tab-active px-6 py-2.5 rounded-lg font-bold text-sm border flex items-center gap-2">
                    <i class="fa-solid fa-file-lines"></i> แบบฟอร์มกรอกทีละบิล
                </button>
                <button onclick="switchMode('bulk')" id="tab-bulk" class="tab-btn tab-inactive px-6 py-2.5 rounded-lg font-bold text-sm border flex items-center gap-2">
                    <i class="fa-solid fa-file-excel"></i> แบบตาราง (ก๊อปวางทีละหลายบิล)
                </button>
            </div>

            <!-- ========================================== -->
            <!-- 📝 โหมดที่ 1: ฟอร์มกรอกทีละบิล (ส่วนที่ 1 ของเดิม) -->
            <!-- ========================================== -->
            <div id="view-single" class="flex flex-col gap-6 flex-1">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex-none">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-5">
                        <h2 class="text-xl font-bold text-primary flex items-center gap-2">
                            <i class="fa-solid fa-folder-plus"></i> <span id="form-title">สร้างรายการรับงานใหม่ (New Booking)</span>
                        </h2>
                    </div>
                    
                    <input type="hidden" id="editingOrderId" value="">

                    <!-- ข้อมูลตั้งต้น -->
                    <div class="bg-blue-50/50 p-5 rounded-xl border border-blue-100 mb-5">
                        <div class="flex flex-wrap gap-5 items-end">
                            <div class="w-64">
                                <label class="block text-sm font-bold text-primary mb-1">🌐 เลือกลักษณะงาน (MODE)</label>
                                <select id="pMode" onchange="toggleModeUI()" class="w-full px-3 py-2 border border-blue-300 rounded-lg text-primary font-bold bg-white text-sm">
                                    <option value="">-- กรุณาเลือก Mode --</option>
                                    <option value="EXPORT">🚢 EXPORT (ขาออก)</option>
                                    <option value="IMPORT">🛬 IMPORT (ขาเข้า)</option>
                                    <option value="TRANSFER">🚚 TRANSFER (ขนถ่าย)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1">📅 วันที่วิ่งงาน</label>
                                <input type="date" id="runDate" class="w-40 px-3 py-2 border border-slate-300 rounded-lg text-sm shadow-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-primary mb-1">จำนวนตู้</label>
                                <input type="number" id="rowCount" value="1" min="1" class="w-24 px-3 py-2 border border-blue-400 rounded-lg text-sm font-bold text-center bg-blue-50">
                            </div>
                            <div class="flex-1 min-w-[250px]">
                                <label class="block text-sm font-semibold text-slate-700 mb-1">🔍 ค้นหาชื่องาน</label>
                                <input type="text" id="jobNameInput" list="jobList" onchange="previewJobData()" onkeyup="previewJobData()" placeholder="พิมพ์ชื่องาน..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white shadow-sm">
                                <datalist id="jobList"></datalist>
                            </div>
                        </div>
                    </div>

                    <!-- ข้อมูลรายละเอียด -->
                    <div id="jobPreviewBox" class="hidden animate-[fadeIn_0.3s_ease-out]">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm mb-5">
                            
                            <!-- โซน EXPORT / IMPORT / TRANSFER (ถูกซ่อนเปิดตาม JS ของคุณ) -->
                            <div id="export-zone" class="export-theme p-4 rounded-xl mb-4 hidden">
                                <div class="font-bold text-amber-700 mb-3"><i class="fa-solid fa-ship mr-2"></i>ข้อมูลสำหรับงาน EXPORT</div>
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                                    <div><label class="block text-slate-600 mb-1">BOOKING NO.</label><input type="text" id="pBookingExp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg"></div>
                                    <div><label class="block text-slate-600 mb-1">AGENT</label><input type="text" id="pAgentExp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg"></div>
                                    <div><label class="block text-slate-600 mb-1">DEPOT</label><input type="text" id="pDepotExp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-amber-50"></div>
                                    <div><label class="block text-slate-600 mb-1">RETURN PORT</label><input type="text" id="pReturnExp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-amber-50"></div>
                                </div>
                            </div>
                            <div id="import-zone" class="import-theme p-4 rounded-xl mb-4 hidden">
                                <div class="font-bold text-blue-700 mb-3"><i class="fa-solid fa-plane-arrival mr-2"></i>ข้อมูลสำหรับงาน IMPORT</div>
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                                    <div><label class="block text-slate-600 mb-1">BL NO.</label><input type="text" id="pBookingImp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg"></div>
                                    <div><label class="block text-slate-600 mb-1">AGENT</label><input type="text" id="pAgentImp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg"></div>
                                    <div><label class="block text-slate-600 mb-1">PORT รับตู้</label><input type="text" id="pPortImp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-blue-50"></div>
                                    <div><label class="block text-slate-600 mb-1">DEPOT คืนตู้</label><input type="text" id="pDepotImp" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-blue-50"></div>
                                </div>
                            </div>
                            <div id="transfer-zone" class="transfer-theme p-4 rounded-xl mb-4 hidden">
                                <div class="font-bold text-orange-700 mb-3"><i class="fa-solid fa-truck-arrow-right mr-2"></i>ข้อมูลสำหรับงาน TRANSFER</div>
                                <div><label class="block text-slate-600 mb-1">REF NO.</label><input type="text" id="pRefTrans" class="w-64 px-3 py-1.5 border border-slate-300 rounded-lg text-sm"></div>
                            </div>

                            <!-- โซนราคา -->
                            <div class="grid grid-cols-2 md:grid-cols-6 gap-4 text-sm bg-slate-50 p-4 rounded-xl border border-slate-200 mt-4">
                                <div><label class="block text-slate-600 mb-1">ลูกค้า</label><input type="text" id="pCustomer" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white"></div>
                                <div><label class="block text-slate-600 mb-1">ต้นทาง (Origin)</label><input type="text" id="pOrigin" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white"></div>
                                <div><label class="block text-slate-600 mb-1">ปลายทาง (Dest)</label><input type="text" id="pDest" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white"></div>
                                <div>
                                    <label class="block text-slate-600 mb-1 font-bold text-primary">ประเภทรถ (ดึงราคา)</label>
                                    <select id="pPriceType" onchange="updateFeeDropdowns()" class="w-full px-3 py-1.5 border border-blue-300 rounded-lg bg-white font-semibold">
                                        <option value="">-- เลือก --</option>
                                        <option value="6W">6W</option>
                                        <option value="10W">10W</option>
                                        <option value="12W*2">12W*2</option>
                                        <option value="เงินสด">เงินสด</option>
                                    </select>
                                </div>
                                <div><label class="block text-slate-600 mb-1">ค่าเที่ยว (คนขับ)</label><input type="text" id="pTripFee" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg font-bold text-green-700 bg-green-50"></div>
                                <div><label class="block text-slate-600 mb-1">ค่าขนส่ง (ลูกค้า)</label><input type="text" id="pTransFee" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg font-bold text-blue-700 bg-blue-50"></div>
                            </div>
                        </div>

                        <div class="mt-5 text-right border-t border-slate-200 pt-5">
                            <button onclick="generateData(this)" class="bg-primary hover:bg-blue-900 text-white font-bold py-3 px-8 rounded-lg shadow-lg flex items-center gap-2 ml-auto">
                                <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- 📋 โหมดที่ 2: ตาราง Excel (ก๊อปวางหลายรายการ) -->
            <!-- ========================================== -->
            <div id="view-bulk" class="bg-white rounded-xl shadow-sm border border-slate-200 flex-col h-[700px] hidden">
                
                <div class="p-4 border-b border-slate-200 bg-slate-50 rounded-t-xl flex justify-between items-end shrink-0">
                    <div>
                        <h2 class="text-lg font-bold text-emerald-700 flex items-center gap-2"><i class="fa-solid fa-file-excel"></i> ก๊อปวางข้อมูลหลาย Booking</h2>
                        <p class="text-xs text-slate-500 mt-1">สามารถก๊อปปี้ข้อมูลที่มีโครงสร้างตรงกันจากไฟล์ Excel มาวางในตารางด้านล่างได้ทันที</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="initBulkTable()" class="bg-white border border-slate-300 text-slate-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-100 transition-colors shadow-sm">
                            <i class="fa-solid fa-rotate mr-1"></i> ล้างตาราง
                        </button>
                        <button onclick="processBulkSave()" id="btn-save-bulk" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-6 rounded-lg shadow-md flex items-center gap-2 text-sm transition-transform">
                            <i class="fa-solid fa-cloud-arrow-up"></i> บันทึกข้อมูลทั้งหมดเข้าระบบ
                        </button>
                    </div>
                </div>

                <!-- พื้นที่แสดงตาราง Handsontable -->
                <div class="flex-1 relative w-full overflow-hidden bg-white">
                    <div id="hot-bulk-container" class="absolute inset-0"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- ลิงก์ไปที่ไฟล์ JS สำหรับโหมดฟอร์มเดี่ยว -->
    <script src="js/modules/booking/form.js"></script>

    <!-- สคริปต์ควบคุม Tabs และ ตาราง Excel -->
    <script>
        // 🔄 ระบบสลับแท็บ
        function switchMode(mode) {
            if (mode === 'single') {
                document.getElementById('view-bulk').classList.add('hidden');
                document.getElementById('view-bulk').classList.remove('flex');
                document.getElementById('view-single').classList.remove('hidden');
                document.getElementById('view-single').classList.add('flex');
                
                document.getElementById('tab-single').className = 'tab-btn tab-active px-6 py-2.5 rounded-lg font-bold text-sm border flex items-center gap-2';
                document.getElementById('tab-bulk').className = 'tab-btn tab-inactive px-6 py-2.5 rounded-lg font-bold text-sm border flex items-center gap-2';
            } else {
                document.getElementById('view-single').classList.add('hidden');
                document.getElementById('view-single').classList.remove('flex');
                document.getElementById('view-bulk').classList.remove('hidden');
                document.getElementById('view-bulk').classList.add('flex');
                
                document.getElementById('tab-bulk').className = 'tab-btn tab-active px-6 py-2.5 rounded-lg font-bold text-sm border flex items-center gap-2';
                document.getElementById('tab-single').className = 'tab-btn tab-inactive px-6 py-2.5 rounded-lg font-bold text-sm border flex items-center gap-2';
                
                if (!hotBulkInstance) initBulkTable(); // วาดตารางครั้งแรกที่กดเปิด
            }
        }

        // 📋 ระบบตาราง Excel (Handsontable)
        let hotBulkInstance = null;
        
        // กำหนดหัวคอลัมน์ให้ครบถ้วนตามฟอร์ม
        const BULK_HEADERS = [
            'สถานะเซฟ', 'MODE', 'วันที่วิ่งงาน', 'จำนวนตู้', 'ลูกค้า', 'ชื่องาน', 
            'ต้นทาง', 'ปลายทาง', 'Booking/BL No.', 'ประเภทรถ', 'ค่าเที่ยว', 'ค่าขนส่ง'
        ];

        function initBulkTable() {
            const container = document.getElementById('hot-bulk-container');
            if (hotBulkInstance) { hotBulkInstance.destroy(); hotBulkInstance = null; }

            const emptyData = Array.from({ length: 20 }, () => new Array(BULK_HEADERS.length).fill(""));

            hotBulkInstance = new Handsontable(container, {
                data: emptyData,
                colHeaders: BULK_HEADERS,
                columns: [
                    { readOnly: true, className: 'ht-status-col htMiddle' }, // [0] สถานะ (พิมพ์ไม่ได้)
                    { type: 'dropdown', source: ['EXPORT', 'IMPORT', 'TRANSFER'] }, // [1] MODE
                    { type: 'date', dateFormat: 'YYYY-MM-DD' }, // [2] วันที่
                    { type: 'numeric' }, // [3] จำนวนตู้
                    { type: 'text' }, // [4] ลูกค้า
                    { type: 'text' }, // [5] ชื่องาน
                    { type: 'text' }, // [6] ต้นทาง
                    { type: 'text' }, // [7] ปลายทาง
                    { type: 'text', className: 'font-bold uppercase htMiddle' }, // [8] Booking No
                    { type: 'dropdown', source: ['6W', '10W', '12W*2', 'เงินสด'] }, // [9] รถ
                    { type: 'numeric', numericFormat: { pattern: '0,0' } }, // [10] ค่าเที่ยว
                    { type: 'numeric', numericFormat: { pattern: '0,0' } }  // [11] ค่าขนส่ง
                ],
                rowHeaders: true,
                width: '100%',
                height: '100%',
                stretchH: 'all',
                minSpareRows: 5,
                contextMenu: true,
                licenseKey: 'non-commercial-and-evaluation'
            });
        }

        // 🚀 ระบบยิงข้อมูลทีละแถวเข้า DB
        async function processBulkSave() {
            if (!hotBulkInstance) return;

            const btn = document.getElementById('btn-save-bulk');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึกข้อมูล...';
            btn.disabled = true;

            const tableData = hotBulkInstance.getData();
            let successCount = 0;

            for (let i = 0; i < tableData.length; i++) {
                const row = tableData[i];
                
                // เช็คว่าแถวนี้มีข้อมูลสำคัญไหม (บังคับต้องมี MODE, วันที่, จำนวนตู้)
                if (!row[1] || !row[2] || !row[3]) continue;

                hotBulkInstance.setDataAtCell(i, 0, '⏳ กำลังบันทึก...');

                const bookingData = {
                    mode: row[1],
                    run_date: row[2],
                    container_count: row[3],
                    customer_name: row[4] || '',
                    job_name: row[5] || '',
                    origin: row[6] || '',
                    destination: row[7] || '',
                    booking_no: row[8] || `TEMP-${Date.now().toString().slice(-5)}`,
                    price_type: row[9] || '',
                    trip_fee: row[10] || 0,
                    trans_fee: row[11] || 0
                };

                try {
                    // [1] ยิง API หัวบิล
                    const resHeader = await fetch('/api/bookings/header', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bookingData)
                    });
                    const resultHeader = await resHeader.json();

                    if (resultHeader.success) {
                        // [2] สร้างตู้ลูกๆ เข้า shipments
                        let shipmentsData = [];
                        const today = new Date().toISOString().split('T')[0];
                        const datePrefix = bookingData.run_date.replace(/-/g, '').substring(2); 

                        for (let c = 0; c < bookingData.container_count; c++) {
                            let orderId = `ORD-${datePrefix}-${Math.floor(1000 + Math.random() * 9000)}-${c+1}`;
                            let sRow = new Array(79).fill(""); 
                            sRow[0] = false; sRow[1] = orderId; sRow[2] = bookingData.mode; sRow[3] = today; sRow[4] = bookingData.run_date;
                            sRow[5] = bookingData.job_name; sRow[6] = bookingData.customer_name; sRow[7] = bookingData.booking_no;
                            sRow[10] = 1; sRow[56] = bookingData.trip_fee; sRow[57] = bookingData.trans_fee; sRow[78] = 'รอจัดรถ';
                            shipmentsData.push(sRow);
                        }

                        const resShipments = await fetch('/api/shipments', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: shipmentsData })
                        });
                        const resultShipments = await resShipments.json();

                        if (resultShipments.success) {
                            hotBulkInstance.setDataAtCell(i, 0, '✅ สำเร็จ');
                            successCount++;
                        } else {
                            hotBulkInstance.setDataAtCell(i, 0, '❌ พลาด (คิวตู้)');
                        }
                    } else {
                        hotBulkInstance.setDataAtCell(i, 0, `❌ พลาด (${resultHeader.message})`);
                    }
                } catch (err) {
                    hotBulkInstance.setDataAtCell(i, 0, '❌ Error API');
                }
            }

            btn.innerHTML = originalText;
            btn.disabled = false;
            
            if (successCount > 0) {
                alert(`🎉 บันทึกข้อมูลสำเร็จทั้งหมด ${successCount} รายการ!`);
            } else {
                alert(`⚠️ ไม่พบข้อมูลที่ถูกต้อง (กรุณาเช็คว่าใส่ MODE, วันที่, และจำนวนตู้ ครบถ้วน)`);
            }
        }
    </script>
</body>
</html>
