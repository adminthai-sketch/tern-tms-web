<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERN TMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('tms_user');
            if (user) {
                window.location.href = '/booking.html';
            } else {
                window.location.href = '/login.html';
            }
        });
    </script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen font-sans text-slate-700">
    <div class="text-center bg-white p-8 rounded-2xl shadow-md border border-slate-200">
        <h2 class="text-xl font-bold mb-2 text-slate-800">🚀 กำลังนำคุณเข้าสู่ระบบ...</h2>
        <p class="text-sm text-slate-500">หากหน้าเว็บไม่เปลี่ยนอัตโนมัติ <a href="/booking.html" class="underline font-bold text-blue-600">คลิกที่นี่</a></p>
    </div>
</body>
</html>
