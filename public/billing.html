<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวางบิล (Billing) - TERN TMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0f4c81', bglight: '#f8fafc' } } } }
    </script>
    
    <link href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .htCenter { text-align: center; vertical-align: middle; }
        .htMiddle { vertical-align: middle; }
    </style>
</head>
<body class="flex flex-col h-screen">
    
    <!-- Top Navigation -->
    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-4 shrink-0 shadow-sm z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-purple-600 text-white rounded flex items-center justify-center text-sm shadow-sm"><i class="fa-solid fa-file-invoice-dollar"></i></div>
            <span class="font-bold text-lg text-slate-800">ระบบวางบิล & บัญชี (Billing)</span>
            
            <div class="h-6 w-px bg-slate-300 mx-2"></div>
            
            <a href="/index.html" class="text-slate-500 hover:text-slate-800 transition-colors flex items-center gap-1.5 text-sm font-semibold px-2 py-1 rounded hover:bg-slate-100">
                <i class="fa-solid fa-house"></i> หน้าแรก
            </a>
            <a href="/booking-manage.html" class="text-slate-500 hover:text-emerald-600 transition-colors flex items-center gap-1.5 text-sm font-semibold px-2 py-1 rounded hover:bg-emerald-50">
                <i class="fa-solid fa-boxes-stacked"></i> จัดการตู้
            </a>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-right">
                <div id="user-fullname" class="text-[13px] font-bold text-slate-700">Loading...</div>
                <div id="user-role-badge" class="inline-block px-1.5 py-0 mt-0 text-[9px] font-bold rounded bg-slate-100 text-slate-500">ROLE</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors p-2" title="ออกจากระบบ"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <!-- Filter & Toolbar -->
    <div class="bg-white border-b border-slate-200 px-4 py-2.5 shrink-0 shadow-sm z-40 flex flex-wrap items-center gap-2">
        <!-- Month Picker -->
        <div class="flex items-center bg-slate-50 border border-slate-200 rounded overflow-hidden">
            <div class="px-2.5 py-1.5 bg-slate-100 border-r border-slate-200 text-slate-500 text-xs font-bold flex items-center gap-1.5">
                <i class="fa-regular fa-calendar-check text-purple-600"></i> เดือน:
            </div>
            <input type="month" id="filter-month" onchange="loadBillingData()" class="px-2 py-1.5 outline-none text-xs font-bold text-slate-700 bg-transparent w-32 cursor-pointer">
        </div>

        <div class="h-6 w-px bg-slate-300 mx-1"></div>

        <!-- Cross Filters -->
        <input type="text" id="filter-run-date" list="dl-run-date" placeholder="📅 ค้นหาจากวันที่" class="border border-slate-200 rounded px-2 py-1.5 text-xs w-32 outline-none focus:border-purple-400" onchange="handleFilter()">
        <datalist id="dl-run-date"></datalist>

        <input type="text" id="filter-customer" list="dl-customer" placeholder="🏢 ลูกค้า..." class="border border-slate-200 rounded px-2 py-1.5 text-xs w-36 outline-none focus:border-purple-400" onchange="handleFilter()">
        <datalist id="dl-customer"></datalist>

        <input type="text" id="filter-booking-no" list="dl-booking-no" placeholder="📄 ค้นหาเลขบุคกิ้ง..." class="border border-slate-200 rounded px-2 py-1.5 text-xs w-36 outline-none focus:border-purple-400" onchange="handleFilter()">
        <datalist id="dl-booking-no"></datalist>

        <input type="text" id="global-search" placeholder="🔍 ค้นหาเบอร์ตู้, ทะเบียนรถ, IV..." class="border border-slate-200 rounded px-2 py-1.5 text-xs w-48 outline-none focus:border-purple-400" onkeyup="handleFilter()">

        <button onclick="clearAllFilters()" class="text-slate-400 hover:text-slate-600 transition-colors p-1.5"><i class="fa-solid fa-eraser"></i></button>

        <div class="flex-1"></div>

        <!-- Print & Save Buttons -->
        <button onclick="printInvoice()" class="bg-blue-50 text-blue-700 font-bold px-3 py-1.5 rounded shadow-sm border border-blue-200 hover:bg-blue-600 hover:text-white transition-colors text-[11px] flex items-center gap-1">
            <i class="fa-solid fa-print"></i> พิมพ์ใบแนบวางบิล
        </button>
        <button id="btn-save-grid" onclick="saveBillingChanges()" class="bg-purple-600 text-white font-bold px-4 py-1.5 rounded shadow-sm border border-purple-700 hover:bg-purple-700 transition-colors text-[11px] flex items-center gap-1.5">
            <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล
        </button>
    </div>

    <!-- KPI Dashboard Area -->
    <div class="px-4 py-2 bg-slate-100 flex items-center gap-4 shrink-0 shadow-inner text-[11px]">
        <span class="font-bold text-slate-500"><i class="fa-solid fa-chart-pie"></i> สรุปประจำเดือน:</span>
        <div class="bg-white border border-rose-200 px-3 py-1 rounded-full flex gap-2 items-center text-rose-700 shadow-sm cursor-pointer hover:bg-rose-50" onclick="setQuickFilter('pending')">
            <i class="fa-solid fa-clock"></i> รอวางบิล (ยังไม่มี IV): 
            <span id="stat-pending-count" class="font-bold">0 ตู้</span> | 
            <span id="stat-pending-amt" class="font-bold">0.00 ฿</span>
        </div>
        <div class="bg-white border border-emerald-200 px-3 py-1 rounded-full flex gap-2 items-center text-emerald-700 shadow-sm cursor-pointer hover:bg-emerald-50" onclick="setQuickFilter('billed')">
            <i class="fa-solid fa-file-invoice"></i> วางบิลแล้ว (มีเลข IV): 
            <span id="stat-billed-count" class="font-bold">0 ตู้</span> | 
            <span id="stat-billed-amt" class="font-bold">0.00 ฿</span>
        </div>
        <div class="flex-1"></div>
        <div id="save-status-badge" class="hidden"></div>
    </div>

    <!-- Table Container -->
    <div class="flex-1 overflow-hidden relative">
        <div id="loading-overlay" class="absolute inset-0 bg-white/80 z-50 flex flex-col items-center justify-center backdrop-blur-sm hidden">
            <div class="w-10 h-10 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin mb-3"></div>
            <div class="font-bold text-purple-700 text-sm">กำลังโหลดข้อมูลบัญชี...</div>
        </div>
        <div id="billing-grid-container" class="w-full h-full"></div>
    </div>

    <script src="/js/modules/billing/billing.js"></script>
    <script>
        function logout() { localStorage.removeItem('tms_user'); window.location.href = '/login.html'; }
    </script>
</body>
</html>
